<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Phone — le jeu du téléphone à l'envers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grad-a:#ffe14d;
    --grad-b:#ffb629;
    --grad-c:#ff8a3d;
    --grad-d:#ff5d5d;
    --ink:#3a2606;
    --deep:#3a2606;
    --shadow:#2a1b04;
    --panel:rgba(58,38,6,.85);
    --panel-line:rgba(255,255,255,.16);
    --mint:#2ed9a3;
    --mint-deep:#0e6b4c;
    --sun:#ffd23f;
    --flame:#e0431f;
    --rec:#ff4d5e;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html{min-height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--grad-a) 0%,var(--grad-b) 40%,var(--grad-c) 72%,var(--grad-d) 100%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:36px 16px 72px;
    position:relative;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(58,38,6,.09) 1.5px, transparent 1.6px);
    background-size:22px 22px;
    mask-image:linear-gradient(115deg, black 0%, transparent 45%, transparent 60%, black 100%);
    -webkit-mask-image:linear-gradient(115deg, black 0%, transparent 45%, transparent 60%, black 100%);
  }
  .app{width:100%;max-width:540px;position:relative;}
  h1,h2,h3,.roomcode,.ticket,button{font-family:'Baloo 2',cursive;}
  h1,h2,h3{margin:0;font-weight:800;}
  h2{text-shadow:0 3px 0 rgba(42,27,4,.15);}

  .eyebrow{
    font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--flame);margin-bottom:6px;
  }
  .title-flip{
    font-family:'Baloo 2',cursive;font-weight:800;
    font-size:52px;line-height:1;letter-spacing:.01em;
    color:var(--ink);
    text-shadow:0 4px 0 rgba(42,27,4,.18);
  }
  .title-flip .mirror{
    display:inline-block;transform:scaleX(-1);color:var(--flame);
    text-shadow:0 4px 0 rgba(122,30,10,.35);
  }
  .subtitle{color:rgba(58,38,6,.82);font-size:14.5px;font-weight:700;margin-top:12px;line-height:1.55;}

  .card{
    background:var(--panel);
    border:3px solid var(--panel-line);
    border-radius:22px;
    padding:24px;
    margin-top:22px;
    box-shadow:0 8px 0 rgba(42,27,4,.3);
    backdrop-filter:blur(6px);
    color:var(--white);
  }

  label{
    display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--sun);margin-bottom:7px;
  }
  input[type=text]{
    width:100%;
    background:rgba(255,255,255,.14);
    border:3px solid rgba(255,255,255,.28);
    color:var(--white);
    padding:13px 15px;border-radius:14px;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;
    margin-bottom:16px;
    transition:border-color .15s, background .15s;
  }
  input[type=text]:focus{outline:none;border-color:var(--mint);background:rgba(255,255,255,.2);}
  input[type=text]::placeholder{color:rgba(255,255,255,.45);font-weight:700;}

  .row{display:flex;gap:12px;}
  .row>*{flex:1;}

  button{
    font-weight:800;font-size:15.5px;letter-spacing:.01em;
    border:3px solid var(--deep);
    background:var(--white);color:var(--deep);
    padding:13px 18px;border-radius:16px;cursor:pointer;
    box-shadow:0 5px 0 var(--shadow);
    transition:transform .08s, box-shadow .08s, background .15s;
  }
  button:hover{background:#fff3d6;}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow);}
  button:focus-visible{outline:3px solid var(--flame);outline-offset:2px;}
  button:disabled{
    opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--shadow);
  }
  button.primary{
    background:var(--mint);border-color:var(--mint-deep);color:#063322;
    box-shadow:0 5px 0 var(--mint-deep);width:100%;
  }
  button.primary:hover{background:#4beab5;}
  button.primary:active{box-shadow:0 1px 0 var(--mint-deep);}
  button.primary:disabled{box-shadow:0 5px 0 var(--mint-deep);}
  button.ghost{
    background:transparent;border-color:rgba(58,38,6,.55);color:var(--ink);
    box-shadow:0 5px 0 rgba(42,27,4,.25);
  }
  button.ghost:hover{background:rgba(58,38,6,.08);}
  .card button.ghost{
    border-color:rgba(255,255,255,.55);color:var(--white);
    box-shadow:0 5px 0 rgba(20,12,2,.5);
  }
  .card button.ghost:hover{background:rgba(255,255,255,.12);}
  button.rec-active{
    background:var(--rec);border-color:#8f1e2a;color:#fff;
    box-shadow:0 5px 0 #8f1e2a;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.25);}}
  @media (prefers-reduced-motion: reduce){
    button.rec-active{animation:none;}
  }

  .players{list-style:none;margin:0;padding:0;}
  .players li{
    display:flex;align-items:center;gap:12px;padding:11px 0;
    border-bottom:2px dashed rgba(255,255,255,.18);
    font-size:15px;font-weight:800;
  }
  .players li:last-child{border-bottom:none;}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--mint);flex-shrink:0;border:2px solid rgba(0,0,0,.25);}
  .dot.you{background:var(--sun);}

  .roomcode{
    font-weight:800;font-size:44px;letter-spacing:.14em;color:var(--ink);
    text-shadow:0 4px 0 rgba(42,27,4,.18);
  }
  .hint{font-size:13px;font-weight:700;color:rgba(58,38,6,.78);line-height:1.5;margin-top:10px;}
  .card .hint{color:rgba(255,255,255,.82);}
  .small{font-size:12px;font-weight:700;color:rgba(58,38,6,.55);}
  .error{color:#ffd4d8;background:rgba(143,30,42,.55);border-radius:10px;font-weight:800;font-size:13px;margin-top:10px;padding:0;}
  .error:not(:empty){padding:8px 12px;}
  .center{text-align:center;}

  .step{
    display:flex;gap:14px;align-items:flex-start;margin-bottom:20px;padding-bottom:20px;
    border-bottom:2px dashed rgba(255,255,255,.18);
  }
  .step:last-of-type{border:none;margin-bottom:0;padding-bottom:0;}
  .step-num{
    font-family:'Baloo 2',cursive;font-weight:800;font-size:17px;
    background:var(--sun);color:var(--deep);
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:3px solid var(--deep);box-shadow:0 3px 0 var(--shadow);
    flex-shrink:0;
  }
  .step-body{flex:1;min-width:0;}
  .step-title{font-family:'Baloo 2',cursive;font-size:16.5px;font-weight:800;margin-bottom:4px;}
  .step-desc{font-size:13px;font-weight:700;color:rgba(255,255,255,.78);line-height:1.5;margin-bottom:12px;}
  .step.locked{opacity:.35;pointer-events:none;filter:saturate(.4);}
  .step.done .step-title{color:var(--mint);}

  audio{width:100%;height:40px;margin-top:8px;border-radius:20px;}

  .badge{
    display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 14px;border-radius:20px;
    border:2px solid rgba(58,38,6,.45);color:rgba(58,38,6,.85);
  }
  .badge.yourturn{background:var(--ink);border-color:var(--ink);color:var(--sun);box-shadow:0 3px 0 rgba(42,27,4,.3);}

  .ticket-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .ticket{
    background:var(--white);color:var(--deep);border:3px solid var(--deep);border-radius:14px;
    padding:10px 15px;font-weight:800;font-size:16px;
    min-width:56px;text-align:center;
    box-shadow:0 4px 0 var(--shadow);
    transform:rotate(-1.2deg);
  }
  .ticket:nth-child(even){transform:rotate(1.4deg);}
  .ticket .who{
    display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:#a58b52;margin-top:2px;
  }

  .chain-label{
    font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--sun);margin:24px 0 10px;
  }
  .divider{height:0;border-top:2px dashed rgba(58,38,6,.35);margin:24px 0;}
  .card .divider{border-top-color:rgba(255,255,255,.25);}
  a.link-btn{color:var(--flame);text-decoration:underline;cursor:pointer;font-size:12px;}

  .player{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.2);
    border-radius:999px;
    padding:6px 14px 6px 6px;
    margin-top:8px;
  }
  .pbtn{
    width:38px;height:38px;border-radius:50%;padding:0;
    font-size:14px;line-height:1;
    background:var(--sun);border:3px solid var(--deep);color:var(--deep);
    box-shadow:0 3px 0 var(--shadow);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow);}
  .pbar{
    flex:1;height:10px;border-radius:999px;
    background:rgba(0,0,0,.35);overflow:hidden;
    border:2px solid rgba(255,255,255,.12);
  }
  .pfill{height:100%;width:0%;background:var(--mint);border-radius:999px;transition:width .15s linear;}
  .ptime{font-size:12px;font-weight:800;color:rgba(255,255,255,.85);min-width:34px;text-align:right;}

  .badge.danger{background:var(--rec);border-color:#8f1e2a;color:#fff;animation:pulse 1s ease-in-out infinite;}

  .name-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .name-row input{margin-bottom:0;}
  .rm-name{
    flex-shrink:0;width:44px;height:48px;padding:0;
    font-size:20px;line-height:1;
    background:transparent;border:3px solid rgba(255,255,255,.35);color:var(--white);
    box-shadow:0 4px 0 rgba(20,12,2,.45);
  }
  .rm-name:hover{background:rgba(255,77,94,.35);border-color:var(--rec);}

  .reveal-card{padding:20px;}
  .chain-title{
    font-family:'Baloo 2',cursive;font-weight:800;font-size:18px;color:var(--sun);
    margin-bottom:4px;
  }
  .phrase{
    background:rgba(0,0,0,.22);
    border:2px solid rgba(255,255,255,.14);
    border-radius:18px;padding:14px;margin-top:14px;
  }
  .phrase-head{display:flex;align-items:center;gap:12px;}
  .phrase-btn{
    width:48px;height:48px;border-radius:50%;padding:0;flex-shrink:0;
    font-size:17px;line-height:1;
    background:var(--mint);border:3px solid var(--mint-deep);color:#063322;
    box-shadow:0 4px 0 var(--mint-deep);
    display:flex;align-items:center;justify-content:center;
  }
  .phrase-btn:hover{background:#4beab5;}
  .phrase-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mint-deep);}
  .phrase-meta{min-width:0;}
  .phrase-label{font-family:'Baloo 2',cursive;font-weight:800;font-size:16px;line-height:1.2;}
  .phrase-desc{font-size:12px;font-weight:700;color:rgba(255,255,255,.6);margin-top:2px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .chip{
    font-size:12px;font-weight:800;
    padding:5px 11px;border-radius:999px;
    background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);
    border:2px solid transparent;
    transition:background .12s, color .12s, transform .12s;
  }
  .chip.active{
    background:var(--sun);color:var(--deep);border-color:var(--deep);
    transform:translateY(-2px) scale(1.06);
  }
  .phrase-bar{
    height:8px;border-radius:999px;margin-top:12px;
    background:rgba(0,0,0,.4);overflow:hidden;
  }
  .phrase-fill{height:100%;width:0%;background:var(--sun);border-radius:999px;transition:width .12s linear;}

  .net-banner{
    position:fixed;top:0;left:0;right:0;z-index:60;
    background:var(--rec);color:#fff;
    font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;
    text-align:center;padding:12px 16px;
    border-bottom:3px solid #8f1e2a;
  }

  .go-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(42,27,4,.72);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(3px);
  }
  .go-num{
    font-family:'Baloo 2',cursive;font-weight:800;font-size:110px;
    color:var(--sun);text-shadow:0 6px 0 rgba(0,0,0,.4);
  }
  .go-num.pop{animation:gopop .55s ease;}
  @keyframes gopop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){.go-num.pop{animation:none;}.badge.danger{animation:none;}}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

// Remplace les {accolades} d'un texte par les valeurs fournies.
function tx(str, vars){
  if(!vars) return str;
  return String(str).replace(/\{(\w+)\}/g, (m, k)=> (k in vars ? vars[k] : m));
}

/* ====================== AUDIO HELPERS ====================== */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

// The mic stream is opened ONCE on first use and kept alive for the whole
// session — closing it after each clip would make the browser re-prompt for
// permission every time on file:// pages (treated as unique origins).
let micStream = null;
async function ensureMic(){
  if(!micAvailable()){
    throw new Error(T.erreurs.microContexte);
  }
  if(!micStream || !micStream.active){
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }
  return micStream;
}

// Recordings are capped at the remaining turn time (plus a safety fallback),
// so a clip can never outlive its turn.
async function recordWithTimer(handle, statusId){
  let ms = 120000;
  if(turnTimer.deadline){
    ms = Math.max(1000, turnTimer.deadline - Date.now());
  }
  return await recordAudio(handle, ms);
}

async function recordAudio(streamHandle, ms){
  const stream = await ensureMic();
  return new Promise((resolve, reject)=>{
    try{
      const chunks = [];
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
      mr.onstop = ()=>{
        resolve(new Blob(chunks, {type: mr.mimeType || 'audio/webm'}));
      };
      mr.onerror = e=>reject(e.error||e);
      mr.start();
      streamHandle.stopFn = ()=>mr.state!=='inactive' && mr.stop();
      if(ms) setTimeout(()=>streamHandle.stopFn(), ms);
    }catch(err){reject(err);}
  });
}

async function blobToAudioBuffer(blob){
  const arrayBuf = await blob.arrayBuffer();
  const ctx = getCtx();
  return await ctx.decodeAudioData(arrayBuf.slice(0));
}

function reverseBuffer(buffer){
  const ctx = getCtx();
  const out = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
  for(let ch=0; ch<buffer.numberOfChannels; ch++){
    const src = buffer.getChannelData(ch);
    const dst = out.getChannelData(ch);
    for(let i=0;i<src.length;i++) dst[i] = src[src.length-1-i];
  }
  return out;
}

function audioBufferToWavBase64(buffer){
  const numCh = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length * numCh * 2 + 44;
  const bufOut = new ArrayBuffer(length);
  const view = new DataView(bufOut);
  function writeStr(off, str){ for(let i=0;i<str.length;i++) view.setUint8(off+i, str.charCodeAt(i)); }
  writeStr(0,'RIFF'); view.setUint32(4, length-8, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28, sampleRate*numCh*2, true); view.setUint16(32, numCh*2, true); view.setUint16(34,16,true);
  writeStr(36,'data'); view.setUint32(40, length-44, true);
  let offset=44;
  const channels=[]; for(let ch=0;ch<numCh;ch++) channels.push(buffer.getChannelData(ch));
  for(let i=0;i<buffer.length;i++){
    for(let ch=0;ch<numCh;ch++){
      let s = Math.max(-1, Math.min(1, channels[ch][i]));
      s = s<0 ? s*0x8000 : s*0x7FFF;
      view.setInt16(offset, s, true); offset+=2;
    }
  }
  let binary=''; const bytes=new Uint8Array(bufOut);
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  return 'data:audio/wav;base64,' + btoa(binary);
}

async function reverseBlobToWavB64(blob){
  const buf = await blobToAudioBuffer(blob);
  const rev = reverseBuffer(buf);
  return audioBufferToWavBase64(rev);
}
async function blobToCleanWavB64(blob){
  const buf = await blobToAudioBuffer(blob);
  return audioBufferToWavBase64(buf);
}

// MediaRecorder already gives us compressed audio (Opus, ~30x smaller than
// raw WAV). We transmit THAT as-is and compute reversals locally at playback
// time — the state stays small enough to fly over a phone connection.
function blobToDataUrl(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(new Error(T.erreurs.lectureImpossible));
    r.readAsDataURL(blob);
  });
}

function audioBufferToWavBlob(buffer){
  const b64 = audioBufferToWavBase64(buffer);
  const bin = atob(b64.split(',')[1]);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type:'audio/wav'});
}

// Lazy, cached reversal: a clip is only decoded+reversed the first time
// someone actually presses play on it.
const reversedCache = new Map();
async function getReversedUrl(src){
  if(reversedCache.has(src)) return reversedCache.get(src);
  const resp = await fetch(src);
  const blob = await resp.blob();
  const buf = await blobToAudioBuffer(blob);
  const url = URL.createObjectURL(audioBufferToWavBlob(reverseBuffer(buf)));
  reversedCache.set(src, url);
  return url;
}

// Short silence used as placeholder when the turn timer expires
// before a required clip was recorded.
function silentWavB64(sec){
  const ctx = getCtx();
  const buf = ctx.createBuffer(1, Math.max(1, Math.round(ctx.sampleRate * (sec || 0.4))), ctx.sampleRate);
  return audioBufferToWavBase64(buf);
}

// Trim leading/trailing silence from a buffer (simple amplitude threshold,
// with a small padding kept around the detected speech).
function trimSilence(buffer, thresh, padMs){
  thresh = thresh || 0.025;
  padMs = padMs || 50;
  const ctx = getCtx();
  const data = buffer.getChannelData(0);
  const pad = Math.round(buffer.sampleRate * padMs / 1000);
  let start = 0, end = data.length - 1;
  while(start < data.length && Math.abs(data[start]) < thresh) start++;
  while(end > start && Math.abs(data[end]) < thresh) end--;
  if(start >= end) return buffer; // all silence — keep as is
  start = Math.max(0, start - pad);
  end = Math.min(data.length - 1, end + pad);
  const out = ctx.createBuffer(1, end - start + 1, buffer.sampleRate);
  out.getChannelData(0).set(data.subarray(start, end + 1));
  return out;
}

// Stitch several data-URL audio clips into one continuous phrase: each clip is
// silence-trimmed, then joined with a short breath between words.
async function concatDataUrls(urls){
  const ctx = getCtx();
  const buffers = [];
  for(const u of urls){
    const resp = await fetch(u);
    const blob = await resp.blob();
    buffers.push(trimSilence(await blobToAudioBuffer(blob)));
  }
  const gap = Math.round(ctx.sampleRate * 0.08);
  const totalLen = buffers.reduce((s,b)=>s+b.length, 0) + gap * (buffers.length - 1);
  const out = ctx.createBuffer(1, totalLen, ctx.sampleRate);
  const dst = out.getChannelData(0);
  const segs = [];
  let offset = 0;
  for(let i=0;i<buffers.length;i++){
    const src = buffers[i].getChannelData(0);
    dst.set(src, offset);
    segs.push({start: offset / ctx.sampleRate, end: (offset + buffers[i].length) / ctx.sampleRate});
    offset += buffers[i].length + gap;
  }
  return {url: URL.createObjectURL(audioBufferToWavBlob(out)), segs};
}

let sfxOn = true;
try{ sfxOn = localStorage.getItem('rp-sfx') !== 'off'; }catch(e){}
function setSfx(on){
  sfxOn = on;
  try{ localStorage.setItem('rp-sfx', on ? 'on' : 'off'); }catch(e){}
}
function blip(freq, dur, type, vol, delay){
  if(!sfxOn) return;
  try{
    const ctx = getCtx();
    const t0 = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol || 0.13, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.12));
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + (dur || 0.12) + 0.02);
  }catch(e){}
}
function sweep(from, to, dur){
  if(!sfxOn) return;
  try{
    const ctx = getCtx();
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(from, t0);
    osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.11, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }catch(e){}
}
const SFX = {
  tick:    ()=>blip(520, 0.09, 'square', 0.09),
  go:      ()=>{ blip(660,0.14,'square',0.12,0); blip(880,0.2,'square',0.12,0.1); },
  recOn:   ()=>blip(300, 0.1, 'sine', 0.12),
  recOff:  ()=>blip(620, 0.1, 'sine', 0.12),
  sent:    ()=>sweep(420, 1100, 0.22),
  urgent:  ()=>blip(880, 0.07, 'square', 0.1),
  reveal:  ()=>{ [523,659,784,1046].forEach((f,i)=>blip(f,0.3,'triangle',0.11,i*0.13)); }
};

/* ====================== STATE / STORAGE ====================== */
const myId = 'p_' + Math.random().toString(36).slice(2,10);
let myName = '';
let currentRoom = null; // room code
let pollTimer = null;
let localState = null;

function roomKey(code){ return 'cadavre-room-' + code; }
function peerIdFor(code){ return 'envers-cadexq-' + code.toLowerCase(); }

// The game state lives in the HOST's browser tab (in-memory). Guests connect
// to the host over WebRTC (PeerJS): every state write is sent to the host,
// which stays the single source of truth and rebroadcasts to everyone.
// The free public PeerJS server is only used for the initial handshake;
// game data flows peer-to-peer.
const memoryStore = {};
const net = { mode:null, peer:null, conns:[], guestConn:null, cache:null };

function teardownNet(){
  try{ if(net.peer) net.peer.destroy(); }catch(e){}
  net.mode=null; net.peer=null; net.conns=[]; net.guestConn=null; net.cache=null;
  const b = document.getElementById('netBanner'); if(b) b.remove();
}

function showNetBanner(msg){
  let b = document.getElementById('netBanner');
  if(!b){ b = document.createElement('div'); b.id='netBanner'; b.className='net-banner'; document.body.appendChild(b); }
  b.textContent = msg;
}

function hostBroadcast(json){
  net.conns.forEach(c=>{ if(c.open) c.send({t:'state', state: json}); });
}

/* --------- Gartic-style parallel chains (online mode) --------- */
// P players -> P chains. Round r: player i plays on chain (i - r) mod P.
// P players -> P chains. The phrase length N (words per chain) is chosen by
// the host and can exceed P: chains simply do several laps around the table.
//   r = 0      : everyone seeds their OWN chain
//   r = 1..N-1 : word turns, chains rotate one step per round
//   r = N      : closing round (perception only)
// Chain played at round r by player i: (i - r) mod P — always a rotation,
// so every chain is covered exactly once per round.
function chainWords(state){ return state.maxTurns || state.order.length; }
function chainsRound(state){
  const N = chainWords(state);
  const words = Math.min.apply(null, state.chains.map(c=>c.turns.length));
  return Math.min(words, N); // r === N means: closing round
}
// A rotation by N would land everyone back on their OWN chain whenever N is a
// multiple of P — shift by one more so the closing round is always a
// derangement (nobody ever closes the chain they started).
function closingOffset(state){
  const P = state.order.length, N = chainWords(state);
  return (N % P === 0) ? N + 1 : N;
}
function currentChainCtx(state){
  const P = state.order.length;
  const N = chainWords(state);
  const r = chainsRound(state);
  const mi = state.order.indexOf(myId);
  const closing = r >= N;
  const off = closing ? closingOffset(state) : r;
  const c = ((mi - off) % P + P) % P;
  return {P, N, r, mi, closing, c};
}
// Parallel submissions can't overwrite the full state (they'd clobber each
// other) — chain turns travel as targeted messages the host merges.
function applyChainMsg(state, msg){
  if(msg.t === 'chainTurn'){
    const ch = state.chains && state.chains[msg.chainIdx];
    if(ch && ch.turns.length === msg.pos) ch.turns.push(msg.turn);
  } else if(msg.t === 'chainClose'){
    const ch = state.chains && state.chains[msg.chainIdx];
    if(ch && !ch.finalPerception) ch.finalPerception = msg.perception;
    if(state.chains && state.chains.every(c=>c.finalPerception)) state.phase = 'reveal';
  }
}
async function submitChainMsg(msg){
  SFX.sent();
  if(net.mode === 'guest'){
    if(net.cache){
      const state = JSON.parse(net.cache);
      applyChainMsg(state, msg); // optimistic — host echo is authoritative
      net.cache = JSON.stringify(state);
    }
    if(net.guestConn && net.guestConn.open) net.guestConn.send(msg);
  } else {
    const state = JSON.parse(memoryStore[roomKey(currentRoom)]);
    applyChainMsg(state, msg);
    const json = JSON.stringify(state);
    memoryStore[roomKey(currentRoom)] = json;
    hostBroadcast(json);
  }
  lastRenderedJson = null;
  poll();
}

function handleHostData(conn, msg){
  if(!msg || !msg.t || !currentRoom) return;
  if(msg.t === 'chainTurn' || msg.t === 'chainClose'){
    const v = memoryStore[roomKey(currentRoom)];
    if(!v) return;
    const state = JSON.parse(v);
    applyChainMsg(state, msg);
    const json = JSON.stringify(state);
    memoryStore[roomKey(currentRoom)] = json;
    hostBroadcast(json);
    poll();
    return;
  }
  if(msg.t === 'hello'){
    const v = memoryStore[roomKey(currentRoom)];
    if(!v) return;
    const state = JSON.parse(v);
    if(!state.players.find(p=>p.id===msg.id)){
      state.players.push({id: msg.id, name: msg.name || 'Joueur'});
      state.order.push(msg.id);
    }
    const json = JSON.stringify(state);
    memoryStore[roomKey(currentRoom)] = json;
    hostBroadcast(json);
    poll();
  } else if(msg.t === 'write'){
    memoryStore[roomKey(currentRoom)] = msg.state;
    hostBroadcast(msg.state);
    poll();
  }
}

async function readRoom(code){
  if(net.mode === 'guest'){
    return net.cache ? JSON.parse(net.cache) : null;
  }
  const v = memoryStore[roomKey(code)];
  return v ? JSON.parse(v) : null;
}

async function writeRoom(code, state){
  const json = JSON.stringify(state);
  if(net.mode === 'guest'){
    net.cache = json; // optimistic local update; host echoes it back
    if(net.guestConn && net.guestConn.open) net.guestConn.send({t:'write', state: json});
    return;
  }
  memoryStore[roomKey(code)] = json;
  if(net.mode === 'host') hostBroadcast(json);
}

function randomCode(){
  const letters='ABCDEFGHJKLMNPQRSTUVWXYZ';
  let c=''; for(let i=0;i<4;i++) c+=letters[Math.floor(Math.random()*letters.length)];
  return c;
}

function readRounds(){
  const el = document.getElementById('roundsInput');
  let n = parseInt(el ? el.value : '6', 10);
  if(isNaN(n)) n = 6;
  return Math.max(2, Math.min(20, n));
}

function readRecSecs(){
  const el = document.getElementById('recSecsInput');
  let n = parseInt(el ? el.value : '45', 10);
  if(isNaN(n)) n = 45;
  return Math.max(15, Math.min(120, n));
}

async function createRoom(){
  if(typeof Peer === 'undefined'){
    showLandingError(T.erreurs.reseauIndisponible);
    resetLandingButtons(); return;
  }
  teardownNet();
  let attempts = 0;
  const tryCode = ()=>{
    const code = randomCode();
    const peer = new Peer(peerIdFor(code));
    peer.on('open', ()=>{
      net.mode = 'host'; net.peer = peer;
      peer.on('connection', conn=>{
        net.conns.push(conn);
        conn.on('data', msg=>handleHostData(conn, msg));
        conn.on('close', ()=>{ net.conns = net.conns.filter(c=>c!==conn); });
      });
      const state = {
        code, players:[{id:myId,name:myName}], order:[myId],
        turnIndex:0, phase:'lobby', turns:[], maxTurns: readRounds(), recSeconds: readRecSecs()
      };
      memoryStore[roomKey(code)] = JSON.stringify(state);
      enterRoom(code);
    });
    peer.on('error', err=>{
      if(err && err.type === 'unavailable-id' && attempts < 3){
        attempts++; try{peer.destroy();}catch(e){} tryCode();
      } else {
        showLandingError(tx(T.erreurs.creationImpossible, {raison: (err && err.type) || 'erreur réseau'}));
        try{peer.destroy();}catch(e){}
        teardownNet(); resetLandingButtons();
      }
    });
  };
  tryCode();
}

async function createLocalRoom(names){
  teardownNet();
  net.mode = 'local';
  let code = randomCode();
  const players = [{id:myId, name: names[0]}];
  const order = [myId];
  for(let i=1;i<names.length;i++){
    const localId = 'local_' + (i+1);
    players.push({id:localId, name: names[i]});
    order.push(localId);
  }
  const state = {
    code, players, order,
    turnIndex:0, phase:'playing', turns:[], solo:true, maxTurns: readRounds(), recSeconds: readRecSecs()
  };
  await writeRoom(code, state);
  enterRoom(code);
}

async function joinRoom(code){
  code = code.trim().toUpperCase();
  if(typeof Peer === 'undefined'){
    showLandingError(T.erreurs.reseauIndisponible);
    resetLandingButtons(); return;
  }
  teardownNet();
  showLandingError(tx(T.erreurs.connexionEnCours, {code: code}));
  const peer = new Peer();
  let settled = false;
  const fail = (msg)=>{
    if(settled || currentRoom) return;
    settled = true;
    showLandingError(msg);
    try{peer.destroy();}catch(e){}
    teardownNet(); resetLandingButtons();
  };
  peer.on('open', ()=>{
    const conn = peer.connect(peerIdFor(code), {reliable:true});
    conn.on('open', ()=>{
      net.mode='guest'; net.peer=peer; net.guestConn=conn;
      conn.send({t:'hello', id: myId, name: myName});
    });
    conn.on('data', msg=>{
      if(msg && msg.t === 'state'){
        net.cache = msg.state;
        if(!settled){ settled = true; enterRoom(code); }
        else { poll(); }
      }
    });
    conn.on('close', ()=>{
      if(currentRoom) showNetBanner(T.erreurs.hotePerdu);
    });
  });
  peer.on('error', err=>{
    fail(T.erreurs.salonIntrouvable);
  });
  setTimeout(()=>fail(T.erreurs.salonIntrouvable), 10000);
}

function enterRoom(code){

  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 2200);
}

let lastRenderedJson = null;
let lastPhaseSeen = null;
let isRecording = false;

async function poll(){
  if(!currentRoom) return;
  const state = await readRoom(currentRoom);
  if(!state) return;
  localState = state;
  const json = JSON.stringify(state);
  // Re-render ONLY if the shared state actually changed, and never mid-recording:
  // re-rendering rebuilds the DOM, which wipes text inputs and recording buttons.
  if(json === lastRenderedJson || isRecording) return;
  const wasPhase = lastPhaseSeen;
  lastPhaseSeen = state.phase;
  lastRenderedJson = json;
  render(roomScreen(state));
  manageTurnTimer(state);
  if(state.phase === 'reveal' && wasPhase !== 'reveal') SFX.reveal();
}

/* ====================== TURN TIMER ====================== */
let turnTimer = {key:null, iv:null, deadline:0};
let submitting = false;
// The turn's chrome only starts after the player taps "Je suis prêt !" —
// readyForKey remembers which turn was armed.
let readyForKey = null;
function turnKeyOf(state){
  if(state.chains) return state.code + ':chains:' + chainsRound(state);
  return state.code + ':' + state.phase + ':' + state.turnIndex;
}

function clearTurnTimer(){
  if(turnTimer.iv) clearInterval(turnTimer.iv);
  turnTimer = {key:null, iv:null, deadline:0};
}

// Called after each render of a game screen: starts the 3-2-1 countdown then
// the turn clock — once per turn, only for the active player.
function manageTurnTimer(state){
  if(!state || (state.phase !== 'playing' && state.phase !== 'closing')){
    clearTurnTimer(); return;
  }
  let mine;
  if(state.chains){
    const {r, closing, c, mi} = currentChainCtx(state);
    const ch = state.chains[c];
    mine = mi >= 0 && !!ch && (closing ? !ch.finalPerception : ch.turns.length < r + 1);
  } else {
    const idx = state.turnIndex;
    const activeId = state.order[idx % state.order.length];
    mine = state.solo ? true : (activeId === myId);
  }
  if(!mine){ clearTurnTimer(); return; }
  const key = turnKeyOf(state);
  if(readyForKey !== key){ clearTurnTimer(); return; } // waiting for the Ready tap
  if(turnTimer.key === key) return; // already running for this turn
  clearTurnTimer();
  turnTimer.key = key;
  startCountdownOverlay(()=>startTurnClock(state));
}

function startCountdownOverlay(cb){
  const ov = document.createElement('div');
  ov.className = 'go-overlay';
  ov.innerHTML = '<div class="go-num">3</div>';
  document.body.appendChild(ov);
  const num = ov.querySelector('.go-num');
  const seq = T.pret.compteARebours;
  let i = 0;
  const step = ()=>{
    if(i >= seq.length){ ov.remove(); cb(); return; }
    num.textContent = seq[i];
    num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
    (i === seq.length - 1) ? SFX.go() : SFX.tick();
    i++;
    setTimeout(step, 700);
  };
  step();
}

function startTurnClock(state){
  const secs = state.recSeconds || 45;
  turnTimer.deadline = Date.now() + secs * 1000;
  const tick = ()=>{
    const left = Math.max(0, Math.ceil((turnTimer.deadline - Date.now()) / 1000));
    const chip = document.getElementById('turnTimerChip');
    if(chip){
      chip.style.display = 'inline-block';
      const prevLeft = chip.dataset.left;
      chip.textContent = '⏱ ' + left + ' s';
      chip.classList.toggle('danger', left <= 5);
      if(prevLeft !== String(left)){
        chip.dataset.left = String(left);
        if(left <= 5 && left > 0) SFX.urgent();
      }
    }
    if(left <= 0){
      if(turnTimer.iv) clearInterval(turnTimer.iv);
      turnTimer.iv = null;
      forceSubmitCurrentTurn();
    }
  };
  tick();
  turnTimer.iv = setInterval(tick, 250);
}

async function waitRecordingSettled(){
  for(let i=0;i<15;i++){
    if(!isRecording) return;
    await new Promise(r=>setTimeout(r,100));
  }
}

// Turn timer hit zero: stop any live recording (it is kept), then submit the
// turn with whatever exists — missing clips become short silences.
async function forceSubmitCurrentTurn(){
  if(submitting) return;
  if(isRecording && streamHandle.stopFn) streamHandle.stopFn();
  await waitRecordingSettled();
  const state = localState;
  if(!state) return;
  if(state.chains && state.phase === 'playing'){
    const {r, closing} = currentChainCtx(state);
    if(closing) await doSubmitClosing();
    else if(r === 0) await doSubmitSeed();
    else await doSubmitTurn();
    return;
  }
  if(state.phase === 'playing' && state.turnIndex === 0) await doSubmitSeed();
  else if(state.phase === 'playing') await doSubmitTurn();
  else if(state.phase === 'closing') await doSubmitClosing();
}

/* ====================== TURN SUBMISSION ====================== */
async function doSubmitChainWord(isSeed){
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById(isSeed ? 'seedSubmitBtn' : 'turnSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = T.enregistrement.envoiEnCours; }
  try{
    const state = localState;
    const {r, c} = currentChainCtx(state);
    const srcBlob = isSeed ? seedBlob : newWordBlob;
    const turn = {
      playerId: myId, playerName: myNameOf(state),
      audio: srcBlob ? await blobToDataUrl(srcBlob) : silentWavB64(),
      perceptionAudio: isSeed ? null : (perceptionBlob ? await blobToDataUrl(perceptionBlob) : silentWavB64())
    };
    await submitChainMsg({t:'chainTurn', chainIdx: c, pos: r, turn});
    seedBlob=null; attemptBlob=null; newWordBlob=null; attemptReversedB64=null; perceptionBlob=null;
  } finally { submitting = false; }
}

async function doSubmitChainClose(){
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('closingSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = T.enregistrement.envoiEnCours; }
  try{
    const state = localState;
    const {c} = currentChainCtx(state);
    const perception = {
      playerName: myNameOf(state),
      perceptionAudio: perceptionBlob ? await blobToDataUrl(perceptionBlob) : silentWavB64()
    };
    await submitChainMsg({t:'chainClose', chainIdx: c, perception});
    attemptBlob=null; attemptReversedB64=null; perceptionBlob=null;
  } finally { submitting = false; }
}

async function doSubmitSeed(){
  if(localState && localState.chains) return doSubmitChainWord(true);
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('seedSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = T.enregistrement.envoiEnCours; }
  try{
    const cleanB64 = seedBlob ? await blobToDataUrl(seedBlob) : silentWavB64();
    const state = await readRoom(currentRoom);
    const activeId = state.order[state.turnIndex % state.order.length];
    const activeName = state.players.find(p=>p.id===activeId).name;
    state.turns.push({playerId:activeId, playerName:activeName, audio:cleanB64});
    state.turnIndex = 1;
    if(state.maxTurns && state.turns.length >= state.maxTurns) state.phase = 'closing';
    await writeRoom(currentRoom, state);
    seedBlob = null;
    lastRenderedJson = null;
  } finally { submitting = false; }
  poll();
}

async function doSubmitTurn(){
  if(localState && localState.chains) return doSubmitChainWord(false);
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('turnSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = T.enregistrement.envoiEnCours; }
  try{
    const cleanB64 = newWordBlob ? await blobToDataUrl(newWordBlob) : silentWavB64();
    const perceptionB64 = perceptionBlob ? await blobToDataUrl(perceptionBlob) : silentWavB64();
    const state = await readRoom(currentRoom);
    const myTurnIdx = state.turnIndex;
    const activeId = state.order[myTurnIdx % state.order.length];
    const activeName = state.players.find(p=>p.id===activeId).name;
    state.turns.push({playerId:activeId, playerName:activeName, audio:cleanB64, perceptionAudio:perceptionB64});
    state.turnIndex = myTurnIdx + 1;
    if(state.maxTurns && state.turns.length >= state.maxTurns) state.phase = 'closing';
    await writeRoom(currentRoom, state);
    attemptBlob=null; newWordBlob=null; attemptReversedB64=null; perceptionBlob=null;
    lastRenderedJson = null;
  } finally { submitting = false; }
  poll();
}

async function doSubmitClosing(){
  if(localState && localState.chains) return doSubmitChainClose();
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('closingSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = T.enregistrement.assemblage; }
  try{
    const perceptionB64 = perceptionBlob ? await blobToDataUrl(perceptionBlob) : silentWavB64();
    const state = await readRoom(currentRoom);
    const activeId = state.order[state.turnIndex % state.order.length];
    const activeName = state.players.find(p=>p.id===activeId).name;
    state.finalPerception = {playerName:activeName, perceptionAudio:perceptionB64};
    state.phase = 'reveal';
    await writeRoom(currentRoom, state);
    attemptBlob=null; attemptReversedB64=null; perceptionBlob=null;
    lastRenderedJson = null;
  } finally { submitting = false; }
  poll();
}

function roomScreen(state){
  const isHost = state.order[0] === myId;
  const me = state.players.find(p=>p.id===myId);
  const meIndex = state.order.indexOf(myId);

  if(state.phase === 'lobby'){
    return `
    <div class="eyebrow">${state.solo ? T.salon.surTitreLocal : T.salon.surTitreEnLigne}</div>
    ${state.solo ? '' : `<div class="roomcode">${state.code}</div>`}
    <p class="subtitle">${state.solo ? T.salon.introLocal : (isHost ? T.salon.introHote : T.salon.introInvite)}</p>
    ${(!state.solo && location.protocol.startsWith('http')) ? `<div style="margin-top:12px;"><button class="ghost" id="copyInviteBtn">${T.salon.boutonCopierLien}</button><span class="small" id="copyStatus" style="margin-left:10px;"></span></div>` : ''}
    ${(isHost && !state.solo) ? `<p class="hint">${T.salon.avertissementHote}</p>` : ''}
    <div class="card">
      <label>${tx(T.salon.labelJoueurs, {n: state.players.length})}</label>
      <ul class="players">
        ${state.players.map(p=>`<li><span class="dot ${p.id===myId?'you':''}"></span>${p.name}${p.id===myId?T.salon.suffixeToi:''}${state.order[0]===p.id?T.salon.suffixeHote:''}</li>`).join('')}
      </ul>
      ${isHost ? `<div class="row" style="margin-top:16px;">
        <div><label for="roundsInput">${T.salon.labelMotsParPhrase}</label><input type="text" id="roundsInput" inputmode="numeric" value="${state.maxTurns || Math.max(state.players.length, 4)}" maxlength="2"></div>
        <div><label for="recSecsInput">${T.salon.labelTemps}</label><input type="text" id="recSecsInput" inputmode="numeric" value="${state.recSeconds || 45}" maxlength="3"></div>
      </div>
      ${state.solo ? '' : `<p class="hint">${tx(T.salon.explicationChaines, {n: state.players.length})}</p>`}
      <button class="primary" id="startBtn" ${state.players.length<2?'disabled':''}>${T.salon.boutonLancer}</button>
      ${state.players.length<2?`<div class="hint">${T.salon.minimumJoueurs}</div>`:''}` : `<div class="hint" style="margin-top:14px;">${T.salon.attenteHote}</div>`}
    </div>
    `;
  }

  if(state.phase === 'playing' && state.chains){
    return chainsScreen(state);
  }

  if(state.phase === 'playing'){
    const turnIdx = state.turnIndex;
    const activePlayerId = state.order[turnIdx % state.order.length];
    const isMyTurn = state.solo ? true : (activePlayerId === myId);
    const activePlayer = state.players.find(p=>p.id===activePlayerId);
    const isSeed = turnIdx === 0;
    const prevTurn = isSeed ? null : state.turns[turnIdx-1];

    const canReveal = state.turns.length >= state.order.length;

    return `
    <div class="eyebrow">${tx(T.tour.surTitre, {code: state.code, n: turnIdx+1, total: state.maxTurns || '∞'})}</div>
    <h2 style="font-size:22px;">${state.solo ? tx(T.tour.titreLocal, {nom: activePlayer.name}) : (isMyTurn ? T.tour.titreMoi : tx(T.tour.titreAutre, {nom: activePlayer.name}))}</h2>
    <span class="badge yourturn" style="margin-top:8px;display:inline-block;">${state.solo ? T.tour.badgeLocal : (isMyTurn?T.tour.badgeMoi:T.tour.badgeAttente)}</span>
    <span class="badge" id="turnTimerChip" style="margin-top:8px;margin-left:8px;display:none;">⏱ –</span>
    ${state.solo ? `<p class="hint" style="margin-top:8px;">${tx(T.tour.passeLAppareil, {nom: activePlayer.name})}</p>` : ''}

    ${isMyTurn ? (readyForKey === turnKeyOf(state) ? myTurnUI(isSeed, prevTurn) : readyUI(state, isSeed, false)) : `<div class="card"><p class="hint">${tx(T.tour.attenteAutre, {nom: activePlayer.name})}</p></div>`}

    <div class="ticket-strip">
      ${state.turns.map((t,i)=>`<div class="ticket">✳<span class="who">${tx(T.tour.etiquetteTour, {n: i+1})}</span></div>`).join('')}
    </div>

    <p class="hint" style="margin-top:20px;">${tx(T.tour.progression, {total: state.maxTurns, faits: state.turns.length})}</p>
    ${canReveal ? `<div class="divider"></div><button class="ghost" id="revealBtn" style="width:100%;">${T.tour.boutonArreter}</button>` : ''}
    `;
  }

  if(state.phase === 'closing'){
    const turnIdx = state.turnIndex;
    const activePlayerId = state.order[turnIdx % state.order.length];
    const isMyTurn = state.solo ? true : (activePlayerId === myId);
    const activePlayer = state.players.find(p=>p.id===activePlayerId);
    const prevTurn = state.turns[state.turns.length-1];
    return `
    <div class="eyebrow">${tx(T.clotureSolo.surTitre, {code: state.code})}</div>
    <h2 style="font-size:22px;">${state.solo ? tx(T.clotureSolo.titreLocal, {nom: activePlayer.name}) : (isMyTurn ? T.clotureSolo.titreMoi : tx(T.clotureSolo.titreAutre, {nom: activePlayer.name}))}</h2>
    <span class="badge yourturn" style="margin-top:8px;display:inline-block;">${T.clotureSolo.badge}</span>
    <span class="badge" id="turnTimerChip" style="margin-top:8px;margin-left:8px;display:none;">⏱ –</span>
    <p class="hint" style="margin-top:8px;">${T.clotureSolo.intro}</p>
    ${isMyTurn ? (readyForKey === turnKeyOf(state) ? closingUI(prevTurn) : readyUI(state, false, true)) : `<div class="card"><p class="hint">${tx(T.clotureSolo.attenteAutre, {nom: activePlayer.name})}</p></div>`}
    `;
  }

  if(state.phase === 'reveal'){
    return revealScreen(state);
  }
}

function chainsScreen(state){
  const {P, N, r, mi, closing, c} = currentChainCtx(state);
  const chain = state.chains[c];
  const owner = state.players.find(p=>p.id===chain.ownerId);
  const played = closing ? !!chain.finalPerception : (chain.turns.length >= r + 1);
  const doneCount = closing
    ? state.chains.filter(ch=>ch.finalPerception).length
    : state.chains.filter(ch=>ch.turns.length >= r + 1).length;
  const prevTurn = closing ? chain.turns[chain.turns.length-1] : (r > 0 ? chain.turns[r-1] : null);
  const title = played ? T.manche.titreEnvoye
    : (r === 0 ? T.manche.titreAmorce
    : (closing ? T.manche.titreCloture : T.manche.titreNormal));
  const ownerName = escapeHtml(owner ? owner.name : '?');
  return `
  <div class="eyebrow">${closing ? tx(T.manche.surTitreCloture, {code: state.code}) : tx(T.manche.surTitreMot, {code: state.code, n: r+1, total: N})}</div>
  <h2 style="font-size:22px;">${title}</h2>
  <span class="badge yourturn" style="margin-top:8px;display:inline-block;">${closing ? T.manche.badgeCloture : T.manche.badgeSimultane}</span>
  <span class="badge" id="turnTimerChip" style="margin-top:8px;margin-left:8px;display:none;">⏱ –</span>
  ${(!played && r > 0 && !closing) ? `<p class="hint" style="margin-top:8px;">${tx(T.manche.chaineDe, {nom: ownerName})}</p>` : ''}
  ${closing && !played ? `<p class="hint" style="margin-top:8px;">${tx(T.manche.clotureDe, {nom: ownerName})}</p>` : ''}
  ${played
    ? `<div class="card"><p class="hint">${tx(T.manche.enAttente, {faits: doneCount, total: P})}</p></div>`
    : (readyForKey === turnKeyOf(state)
        ? (r === 0 ? myTurnUI(true, null) : (closing ? closingUI(prevTurn) : myTurnUI(false, prevTurn)))
        : readyUI(state, r === 0, closing))}
  <p class="hint" style="margin-top:20px;">${tx(T.manche.progression, {faits: doneCount, total: P})}</p>
  `;
}

function revealScreen(state){
  if(state.chains) return chainsRevealScreen(state);
  const realNames = state.turns.map(t=>t.playerName);
  const percNames = state.turns.filter(t=>t.perceptionAudio).map(t=>t.playerName)
    .concat(state.finalPerception ? [state.finalPerception.playerName] : []);
  return `
  <div class="eyebrow">${T.reveal.surTitre}</div>
  <h2 style="font-size:28px;">${T.reveal.titre}</h2>
  <p class="subtitle">${T.reveal.introSolo}</p>
  <div class="card reveal-card">
    ${phraseBlock('solo-real', T.reveal.vraieTitre, T.reveal.vraieTexte, realNames)}
    ${phraseBlock('solo-perceived', T.reveal.percueTitre, T.reveal.percueTexte, percNames)}
  </div>
  <button class="primary" id="replayBtn" style="margin-top:20px;">${T.reveal.boutonRejouer}</button>
  <button class="ghost" id="newGameBtn" style="margin-top:10px;width:100%;">${T.reveal.boutonAccueil}</button>
  `;
}

function phraseBlock(id, label, desc, names){
  return `
  <div class="phrase" id="ph-${id}">
    <div class="phrase-head">
      <button class="phrase-btn" data-ph="${id}">▶</button>
      <div class="phrase-meta">
        <div class="phrase-label">${label}</div>
        <div class="phrase-desc">${desc}</div>
      </div>
    </div>
    <div class="chips">${names.map((n,i)=>`<span class="chip" data-i="${i}">${escapeHtml(n)}</span>`).join('')}</div>
    <div class="phrase-bar"><div class="phrase-fill"></div></div>
  </div>`;
}

function chainsRevealScreen(state){
  return `
  <div class="eyebrow">${T.reveal.surTitre}</div>
  <h2 style="font-size:28px;">${T.reveal.titre}</h2>
  <p class="subtitle">${tx(T.reveal.introChaines, {n: state.chains.length})}</p>
  ${state.chains.map((ch, ci)=>{
    const owner = state.players.find(p=>p.id===ch.ownerId);
    const realNames = ch.turns.map(t=>t.playerName);
    const percNames = ch.turns.filter(t=>t.perceptionAudio).map(t=>t.playerName)
      .concat(ch.finalPerception ? [ch.finalPerception.playerName] : []);
    return `
    <div class="card reveal-card">
      <div class="chain-title">${tx(T.reveal.chaineDe, {nom: escapeHtml(owner ? owner.name : '?')})}</div>
      ${phraseBlock(ci+'-real', T.reveal.vraieTitre, T.reveal.vraieTexte, realNames)}
      ${phraseBlock(ci+'-perceived', T.reveal.percueTitre, T.reveal.percueTexte, percNames)}
    </div>`;
  }).join('')}
  ${(state.order[0] === myId) ? `<button class="primary" id="replayBtn" style="margin-top:20px;">${T.reveal.boutonRejouer}</button>` : `<p class="hint center" style="margin-top:20px;">${T.reveal.hoteRelance}</p>`}
  <button class="ghost" id="newGameBtn" style="margin-top:10px;width:100%;">${T.reveal.boutonAccueil}</button>
  `;
}

// Sources for a phrase id like "2-real" / "solo-perceived".
function phraseSources(state, id){
  const cut = id.lastIndexOf('-');
  const key = id.slice(0, cut), kind = id.slice(cut+1);
  let turns, finalP;
  if(state.chains){
    const ch = state.chains[+key];
    turns = ch.turns; finalP = ch.finalPerception;
  } else {
    turns = state.turns; finalP = state.finalPerception;
  }
  if(kind === 'real') return turns.map(t=>t.audio);
  return turns.filter(t=>t.perceptionAudio).map(t=>t.perceptionAudio)
    .concat(finalP ? [finalP.perceptionAudio] : []);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ====================== EVENTS ====================== */
let seedBlob=null, attemptBlob=null, newWordBlob=null, attemptReversedB64=null, perceptionBlob=null;
const streamHandle = {stopFn:null};
const REC_BTN_IDS = ['seedRecBtn','attemptRecBtn','perceptionRecBtn','newWordRecBtn'];
// While one recording is live, every OTHER record button is disabled: two
// MediaRecorders on the same mic stream corrupt each other's state.
function setRecLock(activeId){
  REC_BTN_IDS.forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.disabled = activeId ? (id !== activeId) : false;
  });
}

function wireEvents(){
  const sfxToggle = document.getElementById('sfxToggle');
  if(sfxToggle) sfxToggle.onclick = ()=>{
    setSfx(!sfxOn);
    sfxToggle.textContent = sfxOn ? T.accueil.sonsActives : T.accueil.sonsCoupes;
    if(sfxOn) SFX.recOff();
  };

  const createBtn = document.getElementById('createBtn');
  if(createBtn){
    createBtn.onclick = async ()=>{
      myName = document.getElementById('nameInput').value.trim();
      if(!myName){ showLandingError(T.erreurs.prenomManquant); return; }
      createBtn.disabled=true; createBtn.textContent=T.enregistrement.envoiEnCours;
      await createRoom();
    };
  }
  renderLocalNames();

  const addPlayerBtn = document.getElementById('addPlayerBtn');
  if(addPlayerBtn) addPlayerBtn.onclick = ()=>{
    if(localNames.length >= 10) return;
    localNames.push('');
    renderLocalNames();
  };

  const localBtn = document.getElementById('localBtn');
  if(localBtn) localBtn.onclick = async ()=>{
    const names = localNames.map((n, i)=> n.trim() || ('Joueur ' + (i+1)));
    if(names.length < 2){ showLandingError(T.erreurs.deuxJoueursMini); return; }
    myName = names[0];
    localBtn.disabled=true;
    await createLocalRoom(names);
  };
  const joinToggle = document.getElementById('joinToggle');
  if(joinToggle) joinToggle.onclick = ()=>{
    document.getElementById('joinBox').style.display='block';
  };
  const joinBtn = document.getElementById('joinBtn');
  if(joinBtn){
    joinBtn.onclick = async ()=>{
      myName = document.getElementById('nameInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      if(!myName){ showLandingError(T.erreurs.prenomManquant); return; }
      if(!code){ showLandingError(T.erreurs.codeManquant); return; }
      joinBtn.disabled=true; joinBtn.textContent=T.enregistrement.envoiEnCours;
      await joinRoom(code);
    };
  }

  const copyInviteBtn = document.getElementById('copyInviteBtn');
  if(copyInviteBtn) copyInviteBtn.onclick = async ()=>{
    const link = location.origin + location.pathname + '?room=' + currentRoom;
    const status = document.getElementById('copyStatus');
    try{
      await navigator.clipboard.writeText(link);
      if(status) status.textContent = T.salon.lienCopie;
    }catch(e){
      window.prompt(T.salon.copieManuelle, link);
    }
    setTimeout(()=>{ const s=document.getElementById('copyStatus'); if(s) s.textContent=''; }, 2500);
  };

  const readyBtn = document.getElementById('readyBtn');
  if(readyBtn) readyBtn.onclick = ()=>{
    if(!localState) return;
    readyForKey = turnKeyOf(localState);
    lastRenderedJson = null;
    poll();
  };

  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = async ()=>{
    const state = await readRoom(currentRoom);
    state.maxTurns = readRounds();
    state.recSeconds = readRecSecs();
    if(!state.solo){
      // Online = Gartic-style: one chain per player, rotating each round.
      state.chains = state.order.map(id=>({ownerId:id, turns:[]}));
      state.maxTurns = Math.max(state.order.length, state.maxTurns || 0);
    }
    state.phase='playing';
    await writeRoom(currentRoom, state);
    lastRenderedJson = null;
    poll();
  };

  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn) revealBtn.onclick = async ()=>{
    const state = await readRoom(currentRoom);
    state.phase='closing';
    await writeRoom(currentRoom, state);
    lastRenderedJson = null;
    poll();
  };


  const replayBtn = document.getElementById('replayBtn');
  if(replayBtn) replayBtn.onclick = async ()=>{
    replayBtn.disabled = true;
    const state = await readRoom(currentRoom);
    state.turns = [];
    state.turnIndex = 0;
    delete state.finalPerception;
    delete state.chains;
    state.phase = 'lobby';
    readyForKey = null;
    stopPhrase(); phraseCache.clear();
    clearTurnTimer();
    await writeRoom(currentRoom, state);
    lastRenderedJson = null;
    poll();
  };

  document.querySelectorAll('.phrase-btn').forEach(b=>{ b.onclick = ()=>playPhrase(b); });

  const newGameBtn = document.getElementById('newGameBtn');
  if(newGameBtn) newGameBtn.onclick = ()=>{
    currentRoom=null; if(pollTimer) clearInterval(pollTimer);
    teardownNet();
    clearTurnTimer();
    stopPhrase(); phraseCache.clear();
    readyForKey = null;
    lastRenderedJson = null;
    render(landingScreen()); wireEvents();
  };

  // Seed turn
  const seedRecBtn = document.getElementById('seedRecBtn');
  if(seedRecBtn) seedRecBtn.onclick = async ()=>{
    if(seedRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    SFX.recOn();
    seedRecBtn.classList.add('rec-active'); seedRecBtn.textContent=T.enregistrement.boutonArreter;
    document.getElementById('seedRecStatus').textContent = T.enregistrement.enCours;
    isRecording = true;
    setRecLock('seedRecBtn');
    try{
      seedBlob = await recordWithTimer(streamHandle, 'seedRecStatus');
      SFX.recOff();
      seedRecBtn.classList.remove('rec-active'); seedRecBtn.textContent=T.enregistrement.boutonRefaire;
      document.getElementById('seedRecStatus').textContent = T.enregistrement.termine;
      const prev = document.getElementById('seedPreview');
      prev.innerHTML = playerHTML(URL.createObjectURL(seedBlob)); prev.style.display='block';
      isRecording = false;
      setRecLock(null);
      checkSeedReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('seedRecStatus').textContent = T.enregistrement.erreurMicro + (e.message||e);
      seedRecBtn.classList.remove('rec-active'); seedRecBtn.textContent=T.enregistrement.boutonAmorce;
    }
  };
  function checkSeedReady(){
    const btn = document.getElementById('seedSubmitBtn');
    btn.disabled = !seedBlob;
  }
  const seedSubmitBtn = document.getElementById('seedSubmitBtn');
  if(seedSubmitBtn) seedSubmitBtn.onclick = ()=>doSubmitSeed();

  // Regular turn
  const attemptRecBtn = document.getElementById('attemptRecBtn');
  if(attemptRecBtn) attemptRecBtn.onclick = async ()=>{
    if(attemptRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    SFX.recOn();
    attemptRecBtn.classList.add('rec-active'); attemptRecBtn.textContent=T.enregistrement.boutonArreter;
    document.getElementById('attemptRecStatus').textContent = T.enregistrement.enCoursTentative;
    isRecording = true;
    setRecLock('attemptRecBtn');
    try{
      attemptBlob = await recordWithTimer(streamHandle, 'attemptRecStatus');
      SFX.recOff();
      attemptRecBtn.classList.remove('rec-active'); attemptRecBtn.textContent=T.enregistrement.boutonRefaire;
      document.getElementById('attemptRecStatus').textContent = T.enregistrement.inversionEnCours;
      attemptReversedB64 = await reverseBlobToWavB64(attemptBlob);
      document.getElementById('attemptRecStatus').textContent = T.enregistrement.tentativeOk;
      document.getElementById('step3').classList.remove('locked');
      const revealAudio = document.getElementById('attemptRevealAudio');
      revealAudio.innerHTML = playerHTML(attemptReversedB64); revealAudio.style.display='block';
      document.getElementById('step4').classList.remove('locked');
      const s5 = document.getElementById('step5');
      if(s5) s5.classList.remove('locked');
      isRecording = false;
      setRecLock(null);
      checkTurnReady();
      checkClosingReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('attemptRecStatus').textContent = T.enregistrement.erreurMicro + (e.message||e);
      attemptRecBtn.classList.remove('rec-active'); attemptRecBtn.textContent=T.enregistrement.boutonTentative;
    }
  };


  const perceptionRecBtn = document.getElementById('perceptionRecBtn');
  if(perceptionRecBtn) perceptionRecBtn.onclick = async ()=>{
    if(perceptionRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    SFX.recOn();
    perceptionRecBtn.classList.add('rec-active'); perceptionRecBtn.textContent=T.enregistrement.boutonArreter;
    document.getElementById('perceptionRecStatus').textContent = T.enregistrement.enCours;
    isRecording = true;
    setRecLock('perceptionRecBtn');
    try{
      perceptionBlob = await recordWithTimer(streamHandle, 'perceptionRecStatus');
      SFX.recOff();
      perceptionRecBtn.classList.remove('rec-active'); perceptionRecBtn.textContent=T.enregistrement.boutonRefaire;
      document.getElementById('perceptionRecStatus').textContent = T.enregistrement.termine;
      isRecording = false;
      setRecLock(null);
      checkTurnReady();
      checkClosingReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('perceptionRecStatus').textContent = T.enregistrement.erreurMicro + (e.message||e);
      perceptionRecBtn.classList.remove('rec-active'); perceptionRecBtn.textContent=T.enregistrement.boutonCompris;
    }
  };

  const newWordRecBtn = document.getElementById('newWordRecBtn');
  if(newWordRecBtn) newWordRecBtn.onclick = async ()=>{
    if(newWordRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    SFX.recOn();
    newWordRecBtn.classList.add('rec-active'); newWordRecBtn.textContent=T.enregistrement.boutonArreter;
    document.getElementById('newWordRecStatus').textContent = T.enregistrement.enCours;
    isRecording = true;
    setRecLock('newWordRecBtn');
    try{
      newWordBlob = await recordWithTimer(streamHandle, 'newWordRecStatus');
      SFX.recOff();
      newWordRecBtn.classList.remove('rec-active'); newWordRecBtn.textContent=T.enregistrement.boutonRefaire;
      document.getElementById('newWordRecStatus').textContent = T.enregistrement.termine;
      isRecording = false;
      setRecLock(null);
      checkTurnReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('newWordRecStatus').textContent = T.enregistrement.erreurMicro + (e.message||e);
      newWordRecBtn.classList.remove('rec-active'); newWordRecBtn.textContent=T.enregistrement.boutonMot;
    }
  };

  function checkTurnReady(){
    const btn = document.getElementById('turnSubmitBtn');
    if(!btn) return;
    btn.disabled = !(newWordBlob && attemptReversedB64 && perceptionBlob);
  }

  function checkClosingReady(){
    const btn = document.getElementById('closingSubmitBtn');
    if(!btn) return;
    btn.disabled = !(attemptReversedB64 && perceptionBlob);
  }

  const closingSubmitBtn = document.getElementById('closingSubmitBtn');
  if(closingSubmitBtn) closingSubmitBtn.onclick = ()=>doSubmitClosing();

  const turnSubmitBtn = document.getElementById('turnSubmitBtn');
  if(turnSubmitBtn) turnSubmitBtn.onclick = ()=>doSubmitTurn();

}

function myNameOf(state){
  const p = state.players.find(p=>p.id===myId);
  return p ? p.name : myName;
}

/* ====================== REVEAL PLAYBACK ====================== */
const phraseCache = new Map();
let phraseAudio = null, phraseTimer = null, phraseActiveBtn = null;

function stopPhrase(){
  if(phraseTimer){ clearInterval(phraseTimer); phraseTimer = null; }
  if(phraseAudio){ phraseAudio.pause(); phraseAudio = null; }
  if(phraseActiveBtn){ phraseActiveBtn.textContent = '▶'; phraseActiveBtn = null; }
  document.querySelectorAll('.chip.active').forEach(c=>c.classList.remove('active'));
}

// Plays a whole stitched phrase and lights up each contributor's chip as
// their word plays — the reveal is meant to be watched, not just heard.
async function playPhrase(btn){
  const id = btn.dataset.ph;
  const box = document.getElementById('ph-' + id);
  if(phraseActiveBtn === btn && phraseAudio && !phraseAudio.paused){ stopPhrase(); return; }
  stopPhrase();
  if(sharedAudio){ sharedAudio.pause(); resetActivePlayer(); }
  btn.textContent = '…';
  let data = phraseCache.get(id);
  if(!data){
    const urls = phraseSources(localState, id);
    if(!urls.length){ btn.textContent = '▶'; return; }
    try{ data = await concatDataUrls(urls); phraseCache.set(id, data); }
    catch(e){ btn.textContent = '▶'; return; }
  }
  phraseAudio = new Audio(data.url);
  phraseActiveBtn = btn;
  btn.textContent = '⏸';
  const chips = box ? box.querySelectorAll('.chip') : [];
  const fill = box ? box.querySelector('.phrase-fill') : null;
  phraseTimer = setInterval(()=>{
    if(!phraseAudio) return;
    const t = phraseAudio.currentTime;
    if(fill && phraseAudio.duration) fill.style.width = (t / phraseAudio.duration * 100) + '%';
    data.segs.forEach((s, i)=>{
      if(chips[i]) chips[i].classList.toggle('active', t >= s.start && t <= s.end);
    });
  }, 60);
  phraseAudio.onended = ()=>{ if(fill) fill.style.width = '100%'; stopPhrase(); };
  phraseAudio.play();
}

/* ====================== INIT ====================== */
render(landingScreen());
(function(){
  const invited = new URLSearchParams(location.search).get('room');
  if(invited && /^[A-Za-z]{4}$/.test(invited)){
    const box = document.getElementById('joinBox');
    const codeInput = document.getElementById('codeInput');
    if(box && codeInput){
      box.style.display = 'block';
      codeInput.value = invited.toUpperCase();
      box.insertAdjacentHTML('afterbegin',
        `<p class="hint" style="margin-top:0;color:var(--sun);">${tx(T.accueil.invitation, {code: invited.toUpperCase()})}</p>`);
    }
  }
})();
