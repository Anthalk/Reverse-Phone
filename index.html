<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<body>
<div id="app" class="app"></div>

<script>
/* ====================== AUDIO HELPERS ====================== */
let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

// The mic stream is opened ONCE on first use and kept alive for the whole
// session — closing it after each clip would make the browser re-prompt for
// permission every time on file:// pages (treated as unique origins).
let micStream = null;
async function ensureMic(){
  if(!micAvailable()){
    throw new Error("micro bloqué — ouvre le jeu via une adresse https (pas un fichier local)");
  }
  if(!micStream || !micStream.active){
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }
  return micStream;
}

// Recordings are capped at the remaining turn time (plus a safety fallback),
// so a clip can never outlive its turn.
async function recordWithTimer(handle, statusId){
  let ms = 120000;
  if(turnTimer.deadline){
    ms = Math.max(1000, turnTimer.deadline - Date.now());
  }
  return await recordAudio(handle, ms);
}

async function recordAudio(streamHandle, ms){
  const stream = await ensureMic();
  return new Promise((resolve, reject)=>{
    try{
      const chunks = [];
      const mr = new MediaRecorder(stream);
      mr.ondataavailable = e=>{ if(e.data.size>0) chunks.push(e.data); };
      mr.onstop = ()=>{
        resolve(new Blob(chunks, {type: mr.mimeType || 'audio/webm'}));
      };
      mr.onerror = e=>reject(e.error||e);
      mr.start();
      streamHandle.stopFn = ()=>mr.state!=='inactive' && mr.stop();
      if(ms) setTimeout(()=>streamHandle.stopFn(), ms);
    }catch(err){reject(err);}
  });
}

async function blobToAudioBuffer(blob){
  const arrayBuf = await blob.arrayBuffer();
  const ctx = getCtx();
  return await ctx.decodeAudioData(arrayBuf.slice(0));
}

function reverseBuffer(buffer){
  const ctx = getCtx();
  const out = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
  for(let ch=0; ch<buffer.numberOfChannels; ch++){
    const src = buffer.getChannelData(ch);
    const dst = out.getChannelData(ch);
    for(let i=0;i<src.length;i++) dst[i] = src[src.length-1-i];
  }
  return out;
}

function audioBufferToWavBase64(buffer){
  const numCh = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length * numCh * 2 + 44;
  const bufOut = new ArrayBuffer(length);
  const view = new DataView(bufOut);
  function writeStr(off, str){ for(let i=0;i<str.length;i++) view.setUint8(off+i, str.charCodeAt(i)); }
  writeStr(0,'RIFF'); view.setUint32(4, length-8, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numCh,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28, sampleRate*numCh*2, true); view.setUint16(32, numCh*2, true); view.setUint16(34,16,true);
  writeStr(36,'data'); view.setUint32(40, length-44, true);
  let offset=44;
  const channels=[]; for(let ch=0;ch<numCh;ch++) channels.push(buffer.getChannelData(ch));
  for(let i=0;i<buffer.length;i++){
    for(let ch=0;ch<numCh;ch++){
      let s = Math.max(-1, Math.min(1, channels[ch][i]));
      s = s<0 ? s*0x8000 : s*0x7FFF;
      view.setInt16(offset, s, true); offset+=2;
    }
  }
  let binary=''; const bytes=new Uint8Array(bufOut);
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  return 'data:audio/wav;base64,' + btoa(binary);
}

async function reverseBlobToWavB64(blob){
  const buf = await blobToAudioBuffer(blob);
  const rev = reverseBuffer(buf);
  return audioBufferToWavBase64(rev);
}
async function blobToCleanWavB64(blob){
  const buf = await blobToAudioBuffer(blob);
  return audioBufferToWavBase64(buf);
}

/* --------- Custom themed audio player (replaces native <audio>) --------- */
function fmtTime(s){ s = Math.floor(s||0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function playerHTML(src){
  return `<div class="player" data-src="${src}">
    <button class="pbtn" type="button" aria-label="Lire">▶</button>
    <div class="pbar"><div class="pfill"></div></div>
    <span class="ptime">0:00</span>
  </div>`;
}
let sharedAudio = null, activePlayerEl = null;
function resetActivePlayer(){
  if(activePlayerEl && document.body.contains(activePlayerEl)){
    activePlayerEl.querySelector('.pbtn').textContent = '▶';
  }
  activePlayerEl = null;
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.pbtn');
  if(!btn) return;
  const wrap = btn.closest('.player');
  if(sharedAudio && activePlayerEl === wrap){
    if(sharedAudio.paused){ sharedAudio.play(); btn.textContent='⏸'; }
    else { sharedAudio.pause(); btn.textContent='▶'; }
    return;
  }
  if(sharedAudio){ sharedAudio.pause(); resetActivePlayer(); }
  sharedAudio = new Audio(wrap.dataset.src);
  activePlayerEl = wrap;
  btn.textContent = '⏸';
  sharedAudio.ontimeupdate = ()=>{
    if(!document.body.contains(wrap)) return;
    if(sharedAudio.duration && isFinite(sharedAudio.duration)){
      wrap.querySelector('.pfill').style.width = (sharedAudio.currentTime / sharedAudio.duration * 100) + '%';
    }
    wrap.querySelector('.ptime').textContent = fmtTime(sharedAudio.currentTime);
  };
  sharedAudio.onended = ()=>{
    if(document.body.contains(wrap)){
      wrap.querySelector('.pfill').style.width = '100%';
      btn.textContent = '▶';
    }
    activePlayerEl = null;
  };
  sharedAudio.play();
});

// Short silence used as placeholder when the turn timer expires
// before a required clip was recorded.
function silentWavB64(sec){
  const ctx = getCtx();
  const buf = ctx.createBuffer(1, Math.max(1, Math.round(ctx.sampleRate * (sec || 0.4))), ctx.sampleRate);
  return audioBufferToWavBase64(buf);
}

// Trim leading/trailing silence from a buffer (simple amplitude threshold,
// with a small padding kept around the detected speech).
function trimSilence(buffer, thresh, padMs){
  thresh = thresh || 0.025;
  padMs = padMs || 50;
  const ctx = getCtx();
  const data = buffer.getChannelData(0);
  const pad = Math.round(buffer.sampleRate * padMs / 1000);
  let start = 0, end = data.length - 1;
  while(start < data.length && Math.abs(data[start]) < thresh) start++;
  while(end > start && Math.abs(data[end]) < thresh) end--;
  if(start >= end) return buffer; // all silence — keep as is
  start = Math.max(0, start - pad);
  end = Math.min(data.length - 1, end + pad);
  const out = ctx.createBuffer(1, end - start + 1, buffer.sampleRate);
  out.getChannelData(0).set(data.subarray(start, end + 1));
  return out;
}

// Stitch several data-URL audio clips into one continuous phrase: each clip is
// silence-trimmed, then joined with a short breath between words.
async function concatDataUrls(urls){
  const ctx = getCtx();
  const buffers = [];
  for(const u of urls){
    const resp = await fetch(u);
    const blob = await resp.blob();
    buffers.push(trimSilence(await blobToAudioBuffer(blob)));
  }
  const gap = Math.round(ctx.sampleRate * 0.08);
  const totalLen = buffers.reduce((s,b)=>s+b.length, 0) + gap * (buffers.length - 1);
  const out = ctx.createBuffer(1, totalLen, ctx.sampleRate);
  const dst = out.getChannelData(0);
  let offset = 0;
  for(let i=0;i<buffers.length;i++){
    const src = buffers[i].getChannelData(0);
    dst.set(src, offset);
    offset += buffers[i].length + gap;
  }
  return audioBufferToWavBase64(out);
}

/* ====================== STATE / STORAGE ====================== */
const myId = 'p_' + Math.random().toString(36).slice(2,10);
let myName = '';
let currentRoom = null; // room code
let pollTimer = null;
let localState = null;

function roomKey(code){ return 'cadavre-room-' + code; }
function peerIdFor(code){ return 'envers-cadexq-' + code.toLowerCase(); }

// The game state lives in the HOST's browser tab (in-memory). Guests connect
// to the host over WebRTC (PeerJS): every state write is sent to the host,
// which stays the single source of truth and rebroadcasts to everyone.
// The free public PeerJS server is only used for the initial handshake;
// game data flows peer-to-peer.
const memoryStore = {};
const net = { mode:null, peer:null, conns:[], guestConn:null, cache:null };

function teardownNet(){
  try{ if(net.peer) net.peer.destroy(); }catch(e){}
  net.mode=null; net.peer=null; net.conns=[]; net.guestConn=null; net.cache=null;
  const b = document.getElementById('netBanner'); if(b) b.remove();
}

function showNetBanner(msg){
  let b = document.getElementById('netBanner');
  if(!b){ b = document.createElement('div'); b.id='netBanner'; b.className='net-banner'; document.body.appendChild(b); }
  b.textContent = msg;
}

function hostBroadcast(json){
  net.conns.forEach(c=>{ if(c.open) c.send({t:'state', state: json}); });
}

/* --------- Gartic-style parallel chains (online mode) --------- */
// P players -> P chains. Round r: player i plays on chain (i - r) mod P.
// Closing round (r = P): each player decodes the END of their OWN chain.
function chainsRound(state){
  const P = state.order.length;
  const minLen = Math.min.apply(null, state.chains.map(c=>c.turns.length));
  return Math.min(minLen, P);
}
function currentChainCtx(state){
  const P = state.order.length;
  const r = chainsRound(state);
  const mi = state.order.indexOf(myId);
  const closing = r >= P;
  const c = closing ? mi : ((mi - r) % P + P) % P;
  return {P, r, mi, closing, c};
}
// Parallel submissions can't overwrite the full state (they'd clobber each
// other) — chain turns travel as targeted messages the host merges.
function applyChainMsg(state, msg){
  if(msg.t === 'chainTurn'){
    const ch = state.chains && state.chains[msg.chainIdx];
    if(ch && ch.turns.length === msg.pos) ch.turns.push(msg.turn);
  } else if(msg.t === 'chainClose'){
    const ch = state.chains && state.chains[msg.chainIdx];
    if(ch && !ch.finalPerception) ch.finalPerception = msg.perception;
    if(state.chains && state.chains.every(c=>c.finalPerception)) state.phase = 'reveal';
  }
}
async function submitChainMsg(msg){
  if(net.mode === 'guest'){
    if(net.cache){
      const state = JSON.parse(net.cache);
      applyChainMsg(state, msg); // optimistic — host echo is authoritative
      net.cache = JSON.stringify(state);
    }
    if(net.guestConn && net.guestConn.open) net.guestConn.send(msg);
  } else {
    const state = JSON.parse(memoryStore[roomKey(currentRoom)]);
    applyChainMsg(state, msg);
    const json = JSON.stringify(state);
    memoryStore[roomKey(currentRoom)] = json;
    hostBroadcast(json);
  }
  lastRenderedJson = null;
  poll();
}

function handleHostData(conn, msg){
  if(!msg || !msg.t || !currentRoom) return;
  if(msg.t === 'chainTurn' || msg.t === 'chainClose'){
    const v = memoryStore[roomKey(currentRoom)];
    if(!v) return;
    const state = JSON.parse(v);
    applyChainMsg(state, msg);
    const json = JSON.stringify(state);
    memoryStore[roomKey(currentRoom)] = json;
    hostBroadcast(json);
    poll();
    return;
  }
  if(msg.t === 'hello'){
    const v = memoryStore[roomKey(currentRoom)];
    if(!v) return;
    const state = JSON.parse(v);
    if(!state.players.find(p=>p.id===msg.id)){
      state.players.push({id: msg.id, name: msg.name || 'Joueur'});
      state.order.push(msg.id);
    }
    const json = JSON.stringify(state);
    memoryStore[roomKey(currentRoom)] = json;
    hostBroadcast(json);
    poll();
  } else if(msg.t === 'write'){
    memoryStore[roomKey(currentRoom)] = msg.state;
    hostBroadcast(msg.state);
    poll();
  }
}

async function readRoom(code){
  if(net.mode === 'guest'){
    return net.cache ? JSON.parse(net.cache) : null;
  }
  const v = memoryStore[roomKey(code)];
  return v ? JSON.parse(v) : null;
}

async function writeRoom(code, state){
  const json = JSON.stringify(state);
  if(net.mode === 'guest'){
    net.cache = json; // optimistic local update; host echoes it back
    if(net.guestConn && net.guestConn.open) net.guestConn.send({t:'write', state: json});
    return;
  }
  memoryStore[roomKey(code)] = json;
  if(net.mode === 'host') hostBroadcast(json);
}

function randomCode(){
  const letters='ABCDEFGHJKLMNPQRSTUVWXYZ';
  let c=''; for(let i=0;i<4;i++) c+=letters[Math.floor(Math.random()*letters.length)];
  return c;
}

function readRounds(){
  const el = document.getElementById('roundsInput');
  let n = parseInt(el ? el.value : '6', 10);
  if(isNaN(n)) n = 6;
  return Math.max(2, Math.min(20, n));
}

function readRecSecs(){
  const el = document.getElementById('recSecsInput');
  let n = parseInt(el ? el.value : '45', 10);
  if(isNaN(n)) n = 45;
  return Math.max(15, Math.min(120, n));
}

async function createRoom(){
  if(typeof Peer === 'undefined'){
    showLandingError("Impossible de charger le module réseau — vérifie ta connexion et recharge la page.");
    resetLandingButtons(); return;
  }
  teardownNet();
  let attempts = 0;
  const tryCode = ()=>{
    const code = randomCode();
    const peer = new Peer(peerIdFor(code));
    peer.on('open', ()=>{
      net.mode = 'host'; net.peer = peer;
      peer.on('connection', conn=>{
        net.conns.push(conn);
        conn.on('data', msg=>handleHostData(conn, msg));
        conn.on('close', ()=>{ net.conns = net.conns.filter(c=>c!==conn); });
      });
      const state = {
        code, players:[{id:myId,name:myName}], order:[myId],
        turnIndex:0, phase:'lobby', turns:[], maxTurns: readRounds(), recSeconds: readRecSecs()
      };
      memoryStore[roomKey(code)] = JSON.stringify(state);
      enterRoom(code);
    });
    peer.on('error', err=>{
      if(err && err.type === 'unavailable-id' && attempts < 3){
        attempts++; try{peer.destroy();}catch(e){} tryCode();
      } else {
        showLandingError("Impossible de créer le salon (" + (err && err.type || 'erreur réseau') + "). Réessaie.");
        try{peer.destroy();}catch(e){}
        teardownNet(); resetLandingButtons();
      }
    });
  };
  tryCode();
}

async function createLocalRoom(numPlayers){
  teardownNet();
  net.mode = 'local';
  let code = randomCode();
  const players = [{id:myId, name: myName || 'Joueur 1'}];
  const order = [myId];
  for(let i=2;i<=numPlayers;i++){
    const localId = 'local_' + i;
    players.push({id:localId, name:'Joueur ' + i});
    order.push(localId);
  }
  const state = {
    code, players, order,
    turnIndex:0, phase:'playing', turns:[], solo:true, maxTurns: readRounds(), recSeconds: readRecSecs()
  };
  await writeRoom(code, state);
  enterRoom(code);
}

async function joinRoom(code){
  code = code.trim().toUpperCase();
  if(typeof Peer === 'undefined'){
    showLandingError("Impossible de charger le module réseau — vérifie ta connexion et recharge la page.");
    resetLandingButtons(); return;
  }
  teardownNet();
  showLandingError('Connexion au salon ' + code + '…');
  const peer = new Peer();
  let settled = false;
  const fail = (msg)=>{
    if(settled || currentRoom) return;
    settled = true;
    showLandingError(msg);
    try{peer.destroy();}catch(e){}
    teardownNet(); resetLandingButtons();
  };
  peer.on('open', ()=>{
    const conn = peer.connect(peerIdFor(code), {reliable:true});
    conn.on('open', ()=>{
      net.mode='guest'; net.peer=peer; net.guestConn=conn;
      conn.send({t:'hello', id: myId, name: myName});
    });
    conn.on('data', msg=>{
      if(msg && msg.t === 'state'){
        net.cache = msg.state;
        if(!settled){ settled = true; enterRoom(code); }
        else { poll(); }
      }
    });
    conn.on('close', ()=>{
      if(currentRoom) showNetBanner("⚠️ On a perdu l'hôte… La partie s'arrête ici.");
    });
  });
  peer.on('error', err=>{
    fail("Salon introuvable — vérifie le code, et que l'hôte a bien son onglet ouvert.");
  });
  setTimeout(()=>fail("Salon introuvable — vérifie le code, et que l'hôte a bien son onglet ouvert."), 10000);
}

function resetLandingButtons(){
  const c = document.getElementById('createBtn');
  if(c){ c.disabled=false; c.textContent='Créer un salon'; }
  const j = document.getElementById('joinBtn');
  if(j){ j.disabled=false; j.textContent='Rejoindre le salon'; }
  const l = document.getElementById('localBtn');
  if(l){ l.disabled=false; }
}

function showLandingError(msg){
  const el = document.getElementById('landingError');
  if(el) el.textContent = msg;
}

function enterRoom(code){
  currentRoom = code;
  poll();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 2200);
}

let lastRenderedJson = null;
let isRecording = false;

async function poll(){
  if(!currentRoom) return;
  const state = await readRoom(currentRoom);
  if(!state) return;
  localState = state;
  const json = JSON.stringify(state);
  // Re-render ONLY if the shared state actually changed, and never mid-recording:
  // re-rendering rebuilds the DOM, which wipes text inputs and recording buttons.
  if(json === lastRenderedJson || isRecording) return;
  lastRenderedJson = json;
  render(roomScreen(state));
  manageTurnTimer(state);
}

/* ====================== TURN TIMER ====================== */
let turnTimer = {key:null, iv:null, deadline:0};
let submitting = false;
// The turn's chrome only starts after the player taps "Je suis prêt !" —
// readyForKey remembers which turn was armed.
let readyForKey = null;
function turnKeyOf(state){
  if(state.chains) return state.code + ':chains:' + chainsRound(state);
  return state.code + ':' + state.phase + ':' + state.turnIndex;
}

function clearTurnTimer(){
  if(turnTimer.iv) clearInterval(turnTimer.iv);
  turnTimer = {key:null, iv:null, deadline:0};
}

// Called after each render of a game screen: starts the 3-2-1 countdown then
// the turn clock — once per turn, only for the active player.
function manageTurnTimer(state){
  if(!state || (state.phase !== 'playing' && state.phase !== 'closing')){
    clearTurnTimer(); return;
  }
  let mine;
  if(state.chains){
    const {r, closing, c, mi} = currentChainCtx(state);
    const ch = state.chains[c];
    mine = mi >= 0 && !!ch && (closing ? !ch.finalPerception : ch.turns.length < r + 1);
  } else {
    const idx = state.turnIndex;
    const activeId = state.order[idx % state.order.length];
    mine = state.solo ? true : (activeId === myId);
  }
  if(!mine){ clearTurnTimer(); return; }
  const key = turnKeyOf(state);
  if(readyForKey !== key){ clearTurnTimer(); return; } // waiting for the Ready tap
  if(turnTimer.key === key) return; // already running for this turn
  clearTurnTimer();
  turnTimer.key = key;
  startCountdownOverlay(()=>startTurnClock(state));
}

function startCountdownOverlay(cb){
  const ov = document.createElement('div');
  ov.className = 'go-overlay';
  ov.innerHTML = '<div class="go-num">3</div>';
  document.body.appendChild(ov);
  const num = ov.querySelector('.go-num');
  const seq = ['3','2','1','À toi !'];
  let i = 0;
  const step = ()=>{
    if(i >= seq.length){ ov.remove(); cb(); return; }
    num.textContent = seq[i];
    num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
    i++;
    setTimeout(step, 700);
  };
  step();
}

function startTurnClock(state){
  const secs = state.recSeconds || 45;
  turnTimer.deadline = Date.now() + secs * 1000;
  const tick = ()=>{
    const left = Math.max(0, Math.ceil((turnTimer.deadline - Date.now()) / 1000));
    const chip = document.getElementById('turnTimerChip');
    if(chip){
      chip.style.display = 'inline-block';
      chip.textContent = '⏱ ' + left + ' s';
      chip.classList.toggle('danger', left <= 5);
    }
    if(left <= 0){
      if(turnTimer.iv) clearInterval(turnTimer.iv);
      turnTimer.iv = null;
      forceSubmitCurrentTurn();
    }
  };
  tick();
  turnTimer.iv = setInterval(tick, 250);
}

async function waitRecordingSettled(){
  for(let i=0;i<15;i++){
    if(!isRecording) return;
    await new Promise(r=>setTimeout(r,100));
  }
}

// Turn timer hit zero: stop any live recording (it is kept), then submit the
// turn with whatever exists — missing clips become short silences.
async function forceSubmitCurrentTurn(){
  if(submitting) return;
  if(isRecording && streamHandle.stopFn) streamHandle.stopFn();
  await waitRecordingSettled();
  const state = localState;
  if(!state) return;
  if(state.chains && state.phase === 'playing'){
    const {r, closing} = currentChainCtx(state);
    if(closing) await doSubmitClosing();
    else if(r === 0) await doSubmitSeed();
    else await doSubmitTurn();
    return;
  }
  if(state.phase === 'playing' && state.turnIndex === 0) await doSubmitSeed();
  else if(state.phase === 'playing') await doSubmitTurn();
  else if(state.phase === 'closing') await doSubmitClosing();
}

/* ====================== TURN SUBMISSION ====================== */
async function doSubmitChainWord(isSeed){
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById(isSeed ? 'seedSubmitBtn' : 'turnSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  try{
    const state = localState;
    const {r, c} = currentChainCtx(state);
    const srcBlob = isSeed ? seedBlob : newWordBlob;
    const cleanB64 = srcBlob ? await blobToCleanWavB64(srcBlob) : silentWavB64();
    const revB64 = srcBlob ? await reverseBlobToWavB64(srcBlob) : cleanB64;
    const turn = {
      playerId: myId, playerName: myNameOf(state),
      audio: cleanB64, reversedAudio: revB64,
      attemptRestoredAudio: isSeed ? null : (attemptReversedB64 || silentWavB64()),
      perceptionAudio: isSeed ? null : (perceptionBlob ? await blobToCleanWavB64(perceptionBlob) : silentWavB64())
    };
    await submitChainMsg({t:'chainTurn', chainIdx: c, pos: r, turn});
    seedBlob=null; attemptBlob=null; newWordBlob=null; attemptReversedB64=null; perceptionBlob=null;
  } finally { submitting = false; }
}

async function doSubmitChainClose(){
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('closingSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  try{
    const state = localState;
    const {c} = currentChainCtx(state);
    const perception = {
      playerName: myNameOf(state),
      perceptionAudio: perceptionBlob ? await blobToCleanWavB64(perceptionBlob) : silentWavB64(),
      attemptRestoredAudio: attemptReversedB64 || silentWavB64()
    };
    await submitChainMsg({t:'chainClose', chainIdx: c, perception});
    attemptBlob=null; attemptReversedB64=null; perceptionBlob=null;
  } finally { submitting = false; }
}

async function doSubmitSeed(){
  if(localState && localState.chains) return doSubmitChainWord(true);
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('seedSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  try{
    const cleanB64 = seedBlob ? await blobToCleanWavB64(seedBlob) : silentWavB64();
    const revB64 = seedBlob ? await reverseBlobToWavB64(seedBlob) : cleanB64;
    const state = await readRoom(currentRoom);
    const activeId = state.order[state.turnIndex % state.order.length];
    const activeName = state.players.find(p=>p.id===activeId).name;
    state.turns.push({playerId:activeId, playerName:activeName, audio:cleanB64, reversedAudio:revB64, attemptRestoredAudio:null});
    state.turnIndex = 1;
    if(state.maxTurns && state.turns.length >= state.maxTurns) state.phase = 'closing';
    await writeRoom(currentRoom, state);
    seedBlob = null;
    lastRenderedJson = null;
  } finally { submitting = false; }
  poll();
}

async function doSubmitTurn(){
  if(localState && localState.chains) return doSubmitChainWord(false);
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('turnSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  try{
    const cleanB64 = newWordBlob ? await blobToCleanWavB64(newWordBlob) : silentWavB64();
    const revB64 = newWordBlob ? await reverseBlobToWavB64(newWordBlob) : cleanB64;
    const perceptionB64 = perceptionBlob ? await blobToCleanWavB64(perceptionBlob) : silentWavB64();
    const restored = attemptReversedB64 || silentWavB64();
    const state = await readRoom(currentRoom);
    const myTurnIdx = state.turnIndex;
    const activeId = state.order[myTurnIdx % state.order.length];
    const activeName = state.players.find(p=>p.id===activeId).name;
    state.turns.push({playerId:activeId, playerName:activeName, audio:cleanB64, reversedAudio:revB64, attemptRestoredAudio:restored, perceptionAudio:perceptionB64});
    state.turnIndex = myTurnIdx + 1;
    if(state.maxTurns && state.turns.length >= state.maxTurns) state.phase = 'closing';
    await writeRoom(currentRoom, state);
    attemptBlob=null; newWordBlob=null; attemptReversedB64=null; perceptionBlob=null;
    lastRenderedJson = null;
  } finally { submitting = false; }
  poll();
}

async function doSubmitClosing(){
  if(localState && localState.chains) return doSubmitChainClose();
  if(submitting) return; submitting = true;
  clearTurnTimer();
  const btn = document.getElementById('closingSubmitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Assemblage…'; }
  try{
    const perceptionB64 = perceptionBlob ? await blobToCleanWavB64(perceptionBlob) : silentWavB64();
    const restored = attemptReversedB64 || silentWavB64();
    const state = await readRoom(currentRoom);
    const activeId = state.order[state.turnIndex % state.order.length];
    const activeName = state.players.find(p=>p.id===activeId).name;
    state.finalPerception = {playerName:activeName, perceptionAudio:perceptionB64, attemptRestoredAudio:restored};
    state.phase = 'reveal';
    await writeRoom(currentRoom, state);
    attemptBlob=null; attemptReversedB64=null; perceptionBlob=null;
    lastRenderedJson = null;
  } finally { submitting = false; }
  poll();
}

function roomScreen(state){
  const isHost = state.order[0] === myId;
  const me = state.players.find(p=>p.id===myId);
  const meIndex = state.order.indexOf(myId);

  if(state.phase === 'lobby'){
    return `
    <div class="eyebrow">Salon</div>
    <div class="roomcode">${state.code}</div>
    <p class="subtitle">Partage ce code à tes copains. Dès que tout le monde est là, ${isHost ? 'lance la partie.' : "attends que l'hôte lance la partie."}</p>
    ${(!state.solo && location.protocol.startsWith('http')) ? `<div style="margin-top:12px;"><button class="ghost" id="copyInviteBtn">Copier le lien d'invitation</button><span class="small" id="copyStatus" style="margin-left:10px;"></span></div>` : ''}
    ${isHost ? `<p class="hint">Détail qui compte : c'est ton onglet qui fait tourner la partie. Tu le fermes, tout s'arrête.</p>` : ''}
    <div class="card">
      <label>Joueurs (${state.players.length})</label>
      <ul class="players">
        ${state.players.map(p=>`<li><span class="dot ${p.id===myId?'you':''}"></span>${p.name}${p.id===myId?' (toi)':''}${state.order[0]===p.id?' — hôte':''}</li>`).join('')}
      </ul>
      ${isHost ? `<div class="row" style="margin-top:16px;">
        ${state.solo ? `<div><label for="roundsInput">Nombre de mots</label><input type="text" id="roundsInput" inputmode="numeric" value="${state.maxTurns || 6}" maxlength="2"></div>` : ''}
        <div><label for="recSecsInput">Temps par tour (s)</label><input type="text" id="recSecsInput" inputmode="numeric" value="${state.recSeconds || 45}" maxlength="3"></div>
      </div>
      ${state.solo ? '' : `<p class="hint">Chacun lance son amorce, puis les chaînes tournent de joueur en joueur — autant de phrases finales que de joueurs.</p>`}
      <button class="primary" id="startBtn" ${state.players.length<2?'disabled':''}>Lancer la partie</button>
      ${state.players.length<2?'<div class="hint">Il faut au moins 2 joueurs.</div>':''}` : `<div class="hint" style="margin-top:14px;">En attente que l'hôte lance la partie…</div>`}
    </div>
    `;
  }

  if(state.phase === 'playing' && state.chains){
    return chainsScreen(state);
  }

  if(state.phase === 'playing'){
    const turnIdx = state.turnIndex;
    const activePlayerId = state.order[turnIdx % state.order.length];
    const isMyTurn = state.solo ? true : (activePlayerId === myId);
    const activePlayer = state.players.find(p=>p.id===activePlayerId);
    const isSeed = turnIdx === 0;
    const prevTurn = isSeed ? null : state.turns[turnIdx-1];

    const canReveal = state.turns.length >= state.order.length;

    return `
    <div class="eyebrow">Salon ${state.code} · tour ${turnIdx+1} / ${state.maxTurns || '∞'}</div>
    <h2 style="font-size:22px;">${state.solo ? `📱 À ${activePlayer.name} de jouer` : (isMyTurn ? "C'est ton tour" : `Au tour de ${activePlayer.name}`)}</h2>
    <span class="badge yourturn" style="margin-top:8px;display:inline-block;">${state.solo ? 'partie locale' : (isMyTurn?'à toi de jouer':'en attente')}</span>
    <span class="badge" id="turnTimerChip" style="margin-top:8px;margin-left:8px;display:none;">⏱ –</span>
    ${state.solo ? `<p class="hint" style="margin-top:8px;">File l'appareil à ${activePlayer.name}. Les autres : on ne regarde pas !</p>` : ''}

    ${isMyTurn ? (readyForKey === turnKeyOf(state) ? myTurnUI(isSeed, prevTurn) : readyUI(state, isSeed, false)) : `<div class="card"><p class="hint">${activePlayer.name} est en train d'écouter, imiter, deviner… Ton tour approche.</p></div>`}

    <div class="ticket-strip">
      ${state.turns.map((t,i)=>`<div class="ticket">✳<span class="who">tour ${i+1}</span></div>`).join('')}
    </div>

    <p class="hint" style="margin-top:20px;">Révélation automatique après ${state.maxTurns} mots — on en est à ${state.turns.length}.</p>
    ${canReveal ? `<div class="divider"></div><button class="ghost" id="revealBtn" style="width:100%;">On s'arrête là, révélation !</button>` : ''}
    `;
  }

  if(state.phase === 'closing'){
    const turnIdx = state.turnIndex;
    const activePlayerId = state.order[turnIdx % state.order.length];
    const isMyTurn = state.solo ? true : (activePlayerId === myId);
    const activePlayer = state.players.find(p=>p.id===activePlayerId);
    const prevTurn = state.turns[state.turns.length-1];
    return `
    <div class="eyebrow">Salon ${state.code} · dernier passage</div>
    <h2 style="font-size:22px;">${state.solo ? `À ${activePlayer.name} de clore la phrase` : (isMyTurn ? "À toi de clore la phrase" : `${activePlayer.name} clôt la phrase`)}</h2>
    <span class="badge yourturn" style="margin-top:8px;display:inline-block;">clôture</span>
    <span class="badge" id="turnTimerChip" style="margin-top:8px;margin-left:8px;display:none;">⏱ –</span>
    <p class="hint" style="margin-top:8px;">Tous les mots sont posés. Reste à décoder le dernier, et on découvre le résultat.</p>
    ${isMyTurn ? (readyForKey === turnKeyOf(state) ? closingUI(prevTurn) : readyUI(state, false, true)) : `<div class="card"><p class="hint">${activePlayer.name} décode le dernier mot… La révélation arrive juste après.</p></div>`}
    `;
  }

  if(state.phase === 'reveal'){
    return revealScreen(state);
  }
}

function chainsScreen(state){
  const {P, r, mi, closing, c} = currentChainCtx(state);
  const chain = state.chains[c];
  const owner = state.players.find(p=>p.id===chain.ownerId);
  const played = closing ? !!chain.finalPerception : (chain.turns.length >= r + 1);
  const doneCount = closing
    ? state.chains.filter(ch=>ch.finalPerception).length
    : state.chains.filter(ch=>ch.turns.length >= r + 1).length;
  const prevTurn = closing ? chain.turns[P-1] : (r > 0 ? chain.turns[r-1] : null);
  const title = played ? "C'est envoyé !"
    : (r === 0 ? "Lance ton amorce"
    : (closing ? "Décode la fin de ta chaîne" : "À toi de jouer"));
  return `
  <div class="eyebrow">Salon ${state.code} · manche ${Math.min(r+1, P)} / ${P}${closing ? ' · clôture' : ''}</div>
  <h2 style="font-size:22px;">${title}</h2>
  <span class="badge yourturn" style="margin-top:8px;display:inline-block;">${closing ? 'clôture' : 'tous en même temps'}</span>
  <span class="badge" id="turnTimerChip" style="margin-top:8px;margin-left:8px;display:none;">⏱ –</span>
  ${(!played && r > 0 && !closing) ? `<p class="hint" style="margin-top:8px;">Tu joues sur la chaîne lancée par ${escapeHtml(owner ? owner.name : '?')}.</p>` : ''}
  ${closing && !played ? `<p class="hint" style="margin-top:8px;">C'est TA chaîne qui revient — découvre ce que ton amorce est devenue.</p>` : ''}
  ${played
    ? `<div class="card"><p class="hint">Ton morceau est parti. On attend les autres… ${doneCount}/${P} ont joué cette manche.</p></div>`
    : (readyForKey === turnKeyOf(state)
        ? (r === 0 ? myTurnUI(true, null) : (closing ? closingUI(prevTurn) : myTurnUI(false, prevTurn)))
        : readyUI(state, r === 0, closing))}
  <p class="hint" style="margin-top:20px;">La manche avance quand tout le monde a joué (${doneCount}/${P}).</p>
  `;
}

function readyUI(state, isSeed, isClosing){
  const steps = isSeed
    ? "tu enregistres le tout premier mot (bien articulé !) et tu l'envoies"
    : (isClosing
      ? "tu écoutes le dernier mot à l'envers, tu l'imites, tu écoutes ta version remise à l'endroit, et tu dis ce que tu as compris"
      : "tu écoutes le son reçu, tu l'imites, tu écoutes ta version remise à l'endroit, tu dis ce que tu as compris, puis tu ajoutes ton mot");
  return `
  <div class="card">
    <div class="step-title">Quand tu veux !</div>
    <p class="hint" style="margin-top:8px;">Au programme : ${steps}.</p>
    <p class="hint">Tu auras ${state.recSeconds || 45} secondes après le compte à rebours. Là tout de suite, le chrono n'a pas commencé — souffle un coup.</p>

}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ====================== EVENTS ====================== */
let seedBlob=null, attemptBlob=null, newWordBlob=null, attemptReversedB64=null, perceptionBlob=null;
const streamHandle = {stopFn:null};
const REC_BTN_IDS = ['seedRecBtn','attemptRecBtn','perceptionRecBtn','newWordRecBtn'];
// While one recording is live, every OTHER record button is disabled: two
// MediaRecorders on the same mic stream corrupt each other's state.
function setRecLock(activeId){
  REC_BTN_IDS.forEach(id=>{
    const b = document.getElementById(id);
    if(b) b.disabled = activeId ? (id !== activeId) : false;
  });
}

function wireEvents(){
  const createBtn = document.getElementById('createBtn');
  if(createBtn){
    createBtn.onclick = async ()=>{
      myName = document.getElementById('nameInput').value.trim();
      if(!myName){ showLandingError("Entre ton prénom d'abord."); return; }
      createBtn.disabled=true; createBtn.textContent='Création…';
      await createRoom();
    };
  }
  const localBtn = document.getElementById('localBtn');
  if(localBtn) localBtn.onclick = async ()=>{
    myName = document.getElementById('nameInput').value.trim() || 'Joueur 1';
    let n = parseInt(document.getElementById('localPlayersInput').value, 10);
    if(isNaN(n)) n = 3;
    n = Math.max(2, Math.min(8, n));
    localBtn.disabled=true;
    await createLocalRoom(n);
  };
  const joinToggle = document.getElementById('joinToggle');
  if(joinToggle) joinToggle.onclick = ()=>{
    document.getElementById('joinBox').style.display='block';
  };
  const joinBtn = document.getElementById('joinBtn');
  if(joinBtn){
    joinBtn.onclick = async ()=>{
      myName = document.getElementById('nameInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      if(!myName){ showLandingError("Entre ton prénom d'abord."); return; }
      if(!code){ showLandingError('Entre un code de salon.'); return; }
      joinBtn.disabled=true; joinBtn.textContent='Connexion…';
      await joinRoom(code);
    };
  }

  const copyInviteBtn = document.getElementById('copyInviteBtn');
  if(copyInviteBtn) copyInviteBtn.onclick = async ()=>{
    const link = location.origin + location.pathname + '?room=' + currentRoom;
    const status = document.getElementById('copyStatus');
    try{
      await navigator.clipboard.writeText(link);
      if(status) status.textContent = 'Lien copié !';
    }catch(e){
      window.prompt('Copie ce lien :', link);
    }
    setTimeout(()=>{ const s=document.getElementById('copyStatus'); if(s) s.textContent=''; }, 2500);
  };

  const readyBtn = document.getElementById('readyBtn');
  if(readyBtn) readyBtn.onclick = ()=>{
    if(!localState) return;
    readyForKey = turnKeyOf(localState);
    lastRenderedJson = null;
    poll();
  };

  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = async ()=>{
    const state = await readRoom(currentRoom);
    state.maxTurns = readRounds();
    state.recSeconds = readRecSecs();
    if(!state.solo){
      // Online = Gartic-style: one chain per player, rotating each round.
      state.chains = state.order.map(id=>({ownerId:id, turns:[]}));
      state.maxTurns = state.order.length;
    }
    state.phase='playing';
    await writeRoom(currentRoom, state);
    lastRenderedJson = null;
    poll();
  };

  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn) revealBtn.onclick = async ()=>{
    const state = await readRoom(currentRoom);
    state.phase='closing';
    await writeRoom(currentRoom, state);
    lastRenderedJson = null;
    poll();
  };

  async function stitchAndPlay(btnId, statusId, audioId, urls, emptyMsg){
    const btn = typeof btnId === 'string' ? document.getElementById(btnId) : btnId;
    const status = document.getElementById(statusId);
    const audioEl = document.getElementById(audioId);
    if(!urls.length){ status.textContent = emptyMsg; return; }
    btn.disabled = true; status.textContent = 'Assemblage…';
    try{
      const stitched = await concatDataUrls(urls);
      audioEl.innerHTML = playerHTML(stitched);
      audioEl.style.display='block';
      status.textContent = '';
      const pb = audioEl.querySelector('.pbtn'); if(pb) pb.click();
    }catch(e){ status.textContent = 'Erreur : ' + (e.message||e); }
    btn.disabled = false;
  }
  const playRealBtn = document.getElementById('playRealBtn');
  if(playRealBtn) playRealBtn.onclick = ()=>{
    stitchAndPlay('playRealBtn','realStatus','realAudio',
      localState.turns.map(t=>t.audio), 'Aucun enregistrement.');
  };
  const playPerceivedBtn = document.getElementById('playPerceivedBtn');
  if(playPerceivedBtn) playPerceivedBtn.onclick = ()=>{
    stitchAndPlay('playPerceivedBtn','perceivedStatus','perceivedAudio',
      localState.turns.filter(t=>t.perceptionAudio).map(t=>t.perceptionAudio)
        .concat(localState.finalPerception ? [localState.finalPerception.perceptionAudio] : []),
      'Rien à écouter ici — il faut au moins 2 tours.');
  };

  const replayBtn = document.getElementById('replayBtn');
  if(replayBtn) replayBtn.onclick = async ()=>{
    replayBtn.disabled = true;
    const state = await readRoom(currentRoom);
    state.turns = [];
    state.turnIndex = 0;
    delete state.finalPerception;
    delete state.chains;
    state.phase = 'lobby';
    readyForKey = null;
    clearTurnTimer();
    await writeRoom(currentRoom, state);
    lastRenderedJson = null;
    poll();
  };

  document.querySelectorAll('.chainPlay').forEach(b=>{
    b.onclick = ()=>{
      const ci = +b.dataset.ci, kind = b.dataset.kind;
      const ch = localState.chains[ci];
      const urls = kind === 'real'
        ? ch.turns.map(t=>t.audio)
        : ch.turns.filter(t=>t.perceptionAudio).map(t=>t.perceptionAudio)
            .concat(ch.finalPerception ? [ch.finalPerception.perceptionAudio] : []);
      stitchAndPlay(b, 'chainStatus-' + kind + '-' + ci, 'chainAudio-' + kind + '-' + ci, urls, 'Rien à écouter ici.');
    };
  });

  const newGameBtn = document.getElementById('newGameBtn');
  if(newGameBtn) newGameBtn.onclick = ()=>{
    currentRoom=null; if(pollTimer) clearInterval(pollTimer);
    teardownNet();
    clearTurnTimer();
    readyForKey = null;
    lastRenderedJson = null;
    render(landingScreen()); wireEvents();
  };

  // Seed turn
  const seedRecBtn = document.getElementById('seedRecBtn');
  if(seedRecBtn) seedRecBtn.onclick = async ()=>{
    if(seedRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    seedRecBtn.classList.add('rec-active'); seedRecBtn.textContent='■ Arrêter';
    document.getElementById('seedRecStatus').textContent = 'Enregistrement…';
    isRecording = true;
    setRecLock('seedRecBtn');
    try{
      seedBlob = await recordWithTimer(streamHandle, 'seedRecStatus');
      seedRecBtn.classList.remove('rec-active'); seedRecBtn.textContent='● Ré-enregistrer';
      document.getElementById('seedRecStatus').textContent = 'Enregistré ✓';
      const prev = document.getElementById('seedPreview');
      prev.innerHTML = playerHTML(URL.createObjectURL(seedBlob)); prev.style.display='block';
      isRecording = false;
      setRecLock(null);
      checkSeedReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('seedRecStatus').textContent = 'Erreur micro : ' + (e.message||e);
      seedRecBtn.classList.remove('rec-active'); seedRecBtn.textContent='● Enregistrer';
    }
  };
  function checkSeedReady(){
    const btn = document.getElementById('seedSubmitBtn');
    btn.disabled = !seedBlob;
  }
  const seedSubmitBtn = document.getElementById('seedSubmitBtn');
  if(seedSubmitBtn) seedSubmitBtn.onclick = ()=>doSubmitSeed();

  // Regular turn
  const attemptRecBtn = document.getElementById('attemptRecBtn');
  if(attemptRecBtn) attemptRecBtn.onclick = async ()=>{
    if(attemptRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    attemptRecBtn.classList.add('rec-active'); attemptRecBtn.textContent='■ Arrêter';
    document.getElementById('attemptRecStatus').textContent = 'Enregistrement de ta tentative…';
    isRecording = true;
    setRecLock('attemptRecBtn');
    try{
      attemptBlob = await recordWithTimer(streamHandle, 'attemptRecStatus');
      attemptRecBtn.classList.remove('rec-active'); attemptRecBtn.textContent='● Ré-enregistrer';
      document.getElementById('attemptRecStatus').textContent = 'Une seconde, je le retourne…';
      attemptReversedB64 = await reverseBlobToWavB64(attemptBlob);
      document.getElementById('attemptRecStatus').textContent = 'Tentative enregistrée ✓';
      document.getElementById('step3').classList.remove('locked');
      const revealAudio = document.getElementById('attemptRevealAudio');
      revealAudio.innerHTML = playerHTML(attemptReversedB64); revealAudio.style.display='block';
      document.getElementById('step4').classList.remove('locked');
      const s5 = document.getElementById('step5');
      if(s5) s5.classList.remove('locked');
      isRecording = false;
      setRecLock(null);
      checkTurnReady();
      checkClosingReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('attemptRecStatus').textContent = 'Erreur micro : ' + (e.message||e);
      attemptRecBtn.classList.remove('rec-active'); attemptRecBtn.textContent='● Enregistrer ma tentative';
    }
  };


  const perceptionRecBtn = document.getElementById('perceptionRecBtn');
  if(perceptionRecBtn) perceptionRecBtn.onclick = async ()=>{
    if(perceptionRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    perceptionRecBtn.classList.add('rec-active'); perceptionRecBtn.textContent='■ Arrêter';
    document.getElementById('perceptionRecStatus').textContent = 'Enregistrement…';
    isRecording = true;
    setRecLock('perceptionRecBtn');
    try{
      perceptionBlob = await recordWithTimer(streamHandle, 'perceptionRecStatus');
      perceptionRecBtn.classList.remove('rec-active'); perceptionRecBtn.textContent='● Ré-enregistrer';
      document.getElementById('perceptionRecStatus').textContent = 'Enregistré ✓';
      isRecording = false;
      setRecLock(null);
      checkTurnReady();
      checkClosingReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('perceptionRecStatus').textContent = 'Erreur micro : ' + (e.message||e);
      perceptionRecBtn.classList.remove('rec-active'); perceptionRecBtn.textContent='● Enregistrer ce que j\'ai compris';
    }
  };

  const newWordRecBtn = document.getElementById('newWordRecBtn');
  if(newWordRecBtn) newWordRecBtn.onclick = async ()=>{
    if(newWordRecBtn.classList.contains('rec-active')){
      streamHandle.stopFn && streamHandle.stopFn();
      return;
    }
    if(isRecording) return; // another recording is live — ignore
    newWordRecBtn.classList.add('rec-active'); newWordRecBtn.textContent='■ Arrêter';
    document.getElementById('newWordRecStatus').textContent = 'Enregistrement…';
    isRecording = true;
    setRecLock('newWordRecBtn');
    try{
      newWordBlob = await recordWithTimer(streamHandle, 'newWordRecStatus');
      newWordRecBtn.classList.remove('rec-active'); newWordRecBtn.textContent='● Ré-enregistrer';
      document.getElementById('newWordRecStatus').textContent = 'Enregistré ✓';
      isRecording = false;
      setRecLock(null);
      checkTurnReady();
    }catch(e){
      isRecording = false;
      setRecLock(null);
      document.getElementById('newWordRecStatus').textContent = 'Erreur micro : ' + (e.message||e);
      newWordRecBtn.classList.remove('rec-active'); newWordRecBtn.textContent='● Enregistrer mon mot';
    }
  };

  function checkTurnReady(){
    const btn = document.getElementById('turnSubmitBtn');
    if(!btn) return;
    btn.disabled = !(newWordBlob && attemptReversedB64 && perceptionBlob);
  }

  function checkClosingReady(){
    const btn = document.getElementById('closingSubmitBtn');
    if(!btn) return;
    btn.disabled = !(attemptReversedB64 && perceptionBlob);
  }

  const closingSubmitBtn = document.getElementById('closingSubmitBtn');
  if(closingSubmitBtn) closingSubmitBtn.onclick = ()=>doSubmitClosing();

  const turnSubmitBtn = document.getElementById('turnSubmitBtn');
  if(turnSubmitBtn) turnSubmitBtn.onclick = ()=>doSubmitTurn();

}

function myNameOf(state){
  const p = state.players.find(p=>p.id===myId);
  return p ? p.name : myName;
}
